<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Ugomba Noel Ltd — Oil Refinery Operations Platform</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>"/>

<!-- PWA: installable on iPhone, Android & tablets -->
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#0f1117"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ugomba Noel"/>
<meta name="application-name" content="Ugomba Noel Ltd"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<!-- PDF export engine (downloadable + printable reports) -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
/* ===== RESET & VARIABLES ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;
  --bg2:#161b27;
  --bg3:#1e2535;
  --bg4:#252d40;
  --bg5:#2e3850;
  --border:#2a3350;
  --border2:#3a4a6a;
  --border3:#4a5a80;
  --text:#e8eaf0;
  --text2:#a0aabf;
  --text3:#6070a0;
  --text4:#3d4d70;
  --accent:#f5a623;
  --accent2:#e8921a;
  --accent3:#ffc55a;
  --green:#2ecc71;
  --green2:#27ae60;
  --red:#e74c3c;
  --red2:#c0392b;
  --blue:#4a9eff;
  --blue2:#2980b9;
  --purple:#9b59b6;
  --cyan:#1abc9c;
  --font:'IBM Plex Sans','Segoe UI',sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
  --radius:6px;
  --radius-lg:10px;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
}

/* ===== BASE ===== */
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overflow-x:hidden}
a{color:var(--blue);text-decoration:none}
input,select,textarea{font-family:var(--font)}
button{font-family:var(--font)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* ===== LAYOUT ===== */
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:240px;min-width:240px;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;
  transition:width .2s;
}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:56px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.page-content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}

/* ===== SIDEBAR ===== */
.sidebar-logo{
  padding:20px 16px 16px;
  border-bottom:1px solid var(--border);
}
.sidebar-logo-hex{font-size:22px;color:var(--accent);line-height:1}
.sidebar-logo-title{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.sidebar-logo-sub{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.5px}
.sidebar-logo-version{font-size:9px;color:var(--text4);margin-top:6px;font-family:var(--mono);background:var(--bg3);padding:2px 6px;border-radius:3px;display:inline-block}

.nav-group{padding:8px 0}
.nav-group-label{
  font-size:9px;color:var(--text4);
  letter-spacing:2px;text-transform:uppercase;
  padding:8px 20px 4px;
  font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 20px;
  cursor:pointer;
  color:var(--text3);
  font-size:13px;
  font-weight:400;
  transition:all .12s;
  border-left:2px solid transparent;
  position:relative;
  user-select:none;
}
.nav-item:hover{background:var(--bg3);color:var(--text2);border-left-color:var(--border2)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(245,166,35,.08),transparent);
  color:var(--accent);
  border-left-color:var(--accent);
  font-weight:500;
}
.nav-item .nav-icon{font-size:13px;width:16px;text-align:center;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{
  margin-left:auto;
  font-size:10px;font-weight:600;
  padding:1px 7px;border-radius:10px;
  background:var(--red);color:#fff;
  font-family:var(--mono);
}
.nav-badge.warn{background:var(--accent);color:#0f1117}
.nav-badge.ok{background:var(--green);color:#0f1117}

.sidebar-user{
  margin-top:auto;
  padding:16px;
  border-top:1px solid var(--border);
  background:var(--bg2);
}
.sidebar-user-name{font-size:13px;font-weight:500;color:var(--text)}
.sidebar-user-pos{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-user-roles{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}

/* ===== TOPBAR ===== */
.topbar-page-title{font-size:15px;font-weight:500;color:var(--text)}
.topbar-breadcrumb{font-size:12px;color:var(--text3);margin-left:4px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-alert{font-size:12px;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px}
.topbar-alert.warn{background:rgba(245,166,35,.12);color:var(--accent);border:1px solid rgba(245,166,35,.25)}
.topbar-alert.danger{background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.25)}
.topbar-user-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:20px;padding:5px 12px 5px 8px;
  cursor:pointer;font-size:12px;
  transition:border-color .12s;
}
.topbar-user-chip:hover{border-color:var(--border2)}
.user-avatar{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;flex-shrink:0;
}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}

/* ===== TYPOGRAPHY ===== */
.page-heading{font-size:20px;font-weight:500;color:var(--text);letter-spacing:-.3px}
.page-sub{font-size:13px;color:var(--text3);margin-top:3px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.mono{font-family:var(--mono)}

/* ===== CARDS ===== */
.card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:16px;
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card.accent-border{border-left:3px solid var(--accent)}
.card.green-border{border-left:3px solid var(--green)}
.card.red-border{border-left:3px solid var(--red)}
.card.blue-border{border-left:3px solid var(--blue)}

/* ===== METRIC CARDS ===== */
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metrics-row.cols-3{grid-template-columns:repeat(3,1fr)}
.metrics-row.cols-2{grid-template-columns:repeat(2,1fr)}
.metric-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;
  position:relative;overflow:hidden;
}
.metric-card::before{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;border-radius:0 var(--radius-lg) 0 60px;
  opacity:.08;
}
.metric-card.accent::before{background:var(--accent)}
.metric-card.green::before{background:var(--green)}
.metric-card.red::before{background:var(--red)}
.metric-card.blue::before{background:var(--blue)}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.metric-value{font-size:26px;font-weight:500;color:var(--text);margin-top:6px;font-family:var(--mono);line-height:1}
.metric-sub{font-size:11px;color:var(--text3);margin-top:5px}
.metric-trend{display:flex;align-items:center;gap:4px;font-size:11px;margin-top:4px}
.metric-trend.up{color:var(--green)}
.metric-trend.down{color:var(--red)}

/* ===== FORMS ===== */
.form-grid{display:grid;gap:14px}
.form-grid.cols-2{grid-template-columns:1fr 1fr}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
.form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.field label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.field input,.field select,.field textarea{
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 12px;
  border-radius:var(--radius);
  font-size:13px;
  transition:border-color .12s,box-shadow .12s;
  outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(245,166,35,.1);
}
.field input::placeholder{color:var(--text4)}
.field select option{background:var(--bg2)}
.field-hint{font-size:10px;color:var(--text3);margin-top:2px}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border-radius:var(--radius);
  border:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;
  transition:all .12s;white-space:nowrap;
}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#0f1117}
.btn-primary:hover:not(:disabled){background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,166,35,.3)}
.btn-success{background:var(--green);color:#0f1117}
.btn-success:hover:not(:disabled){background:var(--green2);transform:translateY(-1px)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--red2);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover:not(:disabled){border-color:var(--border3);color:var(--text);background:var(--bg3)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover:not(:disabled){background:var(--blue2)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-icon{padding:7px;border-radius:var(--radius)}
.btn-full{width:100%;justify-content:center}

/* ===== BADGES ===== */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-approved,.badge-active{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.2)}
.badge-pending{background:rgba(245,166,35,.12);color:var(--accent);border:1px solid rgba(245,166,35,.2)}
.badge-rejected,.badge-inactive{background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.2)}
.badge-low{background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.2)}
.badge-ok{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.2)}
.badge-info{background:rgba(74,158,255,.12);color:var(--blue);border:1px solid rgba(74,158,255,.2)}
.badge-archived{background:rgba(120,132,170,.14);color:var(--text2);border:1px solid rgba(120,132,170,.25)}

/* Role badges */
.role-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.5px}
.rp-superadmin{background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.3)}
.rp-admin{background:rgba(245,166,35,.15);color:var(--accent);border:1px solid rgba(245,166,35,.3)}
.rp-ceo{background:rgba(155,89,182,.15);color:var(--purple);border:1px solid rgba(155,89,182,.3)}
.rp-director{background:rgba(74,158,255,.15);color:var(--blue);border:1px solid rgba(74,158,255,.3)}
.rp-manager{background:rgba(26,188,156,.15);color:var(--cyan);border:1px solid rgba(26,188,156,.3)}
.rp-lab{background:rgba(46,204,113,.15);color:var(--green);border:1px solid rgba(46,204,113,.3)}
.rp-staff{background:rgba(136,146,170,.15);color:var(--text2);border:1px solid rgba(136,146,170,.2)}

/* ===== ALERTS ===== */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;line-height:1.5}
.alert-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.alert-warn{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.25);color:var(--accent)}
.alert-success{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.25);color:var(--green)}
.alert-danger{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);color:var(--red)}
.alert-info{background:rgba(74,158,255,.08);border:1px solid rgba(74,158,255,.25);color:var(--blue)}

/* ===== TABLES ===== */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;padding:10px 14px;
  font-size:10px;color:var(--text3);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:600;
  background:var(--bg3);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{
  padding:10px 14px;
  border-bottom:1px solid rgba(42,51,80,.5);
  color:var(--text2);
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(30,37,53,.7);color:var(--text)}
.td-primary{color:var(--text)!important;font-weight:500}
.td-mono{font-family:var(--mono);font-size:12px!important}
.td-muted{color:var(--text3)!important;font-size:12px}

/* ===== RESULT BOX ===== */
.result-box{
  background:linear-gradient(135deg,rgba(245,166,35,.05),rgba(245,166,35,.02));
  border:1px solid rgba(245,166,35,.25);
  border-radius:var(--radius-lg);
  padding:20px;margin-top:16px;
}
.result-box-title{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:14px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.result-item{background:var(--bg3);border-radius:var(--radius);padding:10px 12px}
.result-item .ri-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.result-item .ri-value{font-size:16px;font-weight:500;font-family:var(--mono);color:var(--text)}
.result-item .ri-unit{font-size:10px;color:var(--text3);margin-left:3px}
.result-compliance{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600}
.rc-pass{background:rgba(46,204,113,.12);color:var(--green);border:1px solid rgba(46,204,113,.2)}
.rc-fail{background:rgba(231,76,60,.12);color:var(--red);border:1px solid rgba(231,76,60,.2)}

/* ===== PROGRESS ===== */
.progress{background:var(--bg4);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.pf-green{background:linear-gradient(90deg,var(--green2),var(--green))}
.pf-amber{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.pf-red{background:linear-gradient(90deg,var(--red2),var(--red))}
.pf-blue{background:linear-gradient(90deg,var(--blue2),var(--blue))}

/* ===== TABS ===== */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;gap:0}
.tab-item{
  padding:10px 18px;font-size:13px;
  color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:all .12s;white-space:nowrap;
}
.tab-item:hover{color:var(--text2)}
.tab-item.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

/* ===== DIVIDER ===== */
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}

/* ===== GRID HELPERS ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-2-3{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.grid-3-2{display:grid;grid-template-columns:3fr 2fr;gap:16px}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;animation:fadeIn .15s;
}
.modal{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius-lg);padding:24px;
  width:90%;max-width:520px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow);animation:slideUp .18s;
}
.modal-title{font-size:16px;font-weight:500;color:var(--text);margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text3);margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== LOGIN ===== */
.login-page{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  background:radial-gradient(ellipse at 20% 50%,rgba(245,166,35,.04) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 20%,rgba(74,158,255,.03) 0%,transparent 60%),
             var(--bg);
}
.login-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:16px;
  padding:44px;
  width:420px;
  box-shadow:var(--shadow);
}
.login-header{text-align:center;margin-bottom:36px}
.login-hex{font-size:36px;color:var(--accent);display:block;margin-bottom:10px;animation:pulse 3s ease-in-out infinite}
.login-title{font-size:18px;font-weight:600;color:var(--accent);letter-spacing:3px;text-transform:uppercase}
.login-subtitle{font-size:12px;color:var(--text3);margin-top:5px;letter-spacing:.5px}
.login-divider{margin:24px 0;border:none;border-top:1px solid var(--border);position:relative}
.login-divider::after{content:'DEMO ACCESS';position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--bg2);padding:0 10px;font-size:10px;color:var(--text4);letter-spacing:2px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-btn{
  padding:9px 12px;background:var(--bg3);
  border:1px solid var(--border);color:var(--text2);
  border-radius:var(--radius);font-size:12px;
  cursor:pointer;font-family:var(--font);
  transition:all .12s;text-align:center;
}
.demo-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.05)}
.demo-btn.superadmin{border-color:rgba(231,76,60,.3);color:var(--red)}
.demo-btn.superadmin:hover{background:rgba(231,76,60,.05)}
.demo-btn.admin{border-color:rgba(245,166,35,.3);color:var(--accent)}
.demo-btn .db-role{font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ===== ACCESS DENIED ===== */
.access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px;text-align:center}
.access-denied-icon{font-size:48px;margin-bottom:16px;opacity:.3}
.access-denied-title{font-size:18px;font-weight:500;color:var(--red);margin-bottom:8px}
.access-denied-sub{font-size:13px;color:var(--text3);max-width:320px}

/* ===== COST CHAIN ===== */
.price-chain{display:flex;align-items:stretch;gap:0;margin:16px 0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}

const COMPETITOR_BRANDS = [

const DAY_MS = 86400000;
function weeklyCompetitorPrices(tuesday){
  const seed = Math.floor(tuesday.getTime()/DAY_MS);
  return COMPETITOR_BRANDS.map((b,idx)=>{
    const r = Math.sin(seed*(idx+1)*12.9898)*43758.5453;
    const frac = r - Math.floor(r);        // stable pseudo-random 0..1 for this week
    const delta = (frac-0.5)*0.06;          // ±3% weekly movement
    return { ...b, price: Math.round((b.base*(1+delta))/5)*5 };
  });
}

/* Batch number format: [Line]-[YYMMDD]-[Sequence] — e.g. GNO-260814-01, SBO-260814-01.

function mostRecentTuesday(d=new Date()){
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = (x.getDay()+5)%7;         // days since the most recent Tuesday (Tue=2)

}
function nextTuesday(d=new Date()){
  const t = mostRecentTuesday(d); const n = new Date(t); n.setDate(n.getDate()+7); return n;

/* Expiry evaluation for inventory items. Returns kind + days-to-expiry. */
function expiryStatus(dateStr, warnDays=60){
  if (!dateStr) return { kind:'none', days:null };
  const d = new Date(dateStr + 'T00:00:00'); if (isNaN(d)) return { kind:'none', days:null };
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today)/86400000);

}

  .note{font-size:10.5px;color:#5a6373;background:#f7f8fa;border:1px solid #e2e5ec;border-radius:6px;padding:10px 12px;margin-top:10px}
  .rpt-foot{margin-top:34px;padding-top:12px;border-top:1px solid #d7dbe3;font-size:10px;color:#7a8290;display:flex;justify-content:space-between;gap:16px}
  @media print{@page{margin:14mm} .sheet{padding:0;max-width:none} .no-print{display:none} table.rpt tr{break-inside:avoid} h2.rpt-sec{break-after:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
`;
/* Neutral cell / status model shared by the HTML (print) and PDF emitters.
   Cell forms: string | number | {num:true,text} | {status:'ok|warn|bad|info|neutral', text}
   Section forms: {kpis:[{label,value,sub}]} | {title, head:[...], rows:[[cell]]} | {note} */
const RPT_KINDS = {
  ok:      { pdf:[26,127,67] },
  warn:    { pdf:[154,98,18] },
  bad:     { pdf:[178,48,37] },
  info:    { pdf:[28,95,176] },
  neutral: { pdf:[74,82,98] },
};
const reportMetaBase = (user) => [['Generated', nowStr()], ['Prepared by', user?`${user.name} (${user.position})`:'System']];

/* ---- HTML (printable) rendering ---- */
function htmlCell(c){
  if (c && typeof c==='object'){
    if (c.status) return `<td><span class="pill ${c.status}">${esc(c.text)}</span></td>`;
    if (c.num)    return `<td class="num">${esc(c.text)}</td>`;
  }
  return `<td>${esc(c)}</td>`;
}
function htmlTable(head, rows){
  const th = head.map(h=>{const o=typeof h==='object';return `<th class="${o&&h.num?'num':''}">${esc(o?h.label:h)}</th>`;}).join('');
  const tb = rows.length ? rows.map(r=>`<tr>${r.map(htmlCell).join('')}</tr>`).join('')
    : `<tr><td colspan="${head.length}" style="text-align:center;color:#7a8290;padding:18px">No records</td></tr>`;
  return `<table class="rpt"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>`;
}
function sectionsToHtml(sections){
  return sections.map(s=>{
    if (s.kpis) return `<div class="kpis">${s.kpis.map(i=>`<div class="kpi"><div class="k-l">${esc(i.label)}</div><div class="k-v">${esc(i.value)}</div>${i.sub?`<div class="k-s">${esc(i.sub)}</div>`:''}</div>`).join('')}</div>`;
    if (s.head) return `${s.title?`<h2 class="rpt-sec">${esc(s.title)}</h2>`:''}${htmlTable(s.head, s.rows||[])}`;
    if (s.note!=null) return `<div class="note">${s.noteHtml||esc(s.note)}</div>`;
    return '';
  }).join('');
}
function openPrintableReport(meta, sections){
  const w = window.open('', '_blank', 'width=1000,height=800');
  if(!w){ alert('Please allow pop-ups for this site to generate the printable report.'); return; }
  const statusPill = meta.status ? `<span class="rpt-badge" style="border-color:${meta.status.color};color:${meta.status.color}">${esc(meta.status.text)}</span>` : '';
  const metaRow = (meta.metaItems||[]).map(m=>`<span><b>${esc(m[0])}:</b> ${esc(m[1])}</span>`).join('');
  const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(meta.title)} — ${esc(COMPANY)}</title><style>${REPORT_CSS}</style></head><body><div class="sheet">
    <div class="rpt-head"><div class="rpt-seal">⬡</div><div><div class="rpt-org">${esc(COMPANY)}</div><div class="rpt-org-sub">${esc(COMPANY_SUB)} · Official Report</div></div>${statusPill}</div>
    <div class="rpt-title">${esc(meta.title)}</div>
    <div class="rpt-meta">${metaRow}</div>
    ${sectionsToHtml(sections)}
    <div class="rpt-foot"><span>${esc(COMPANY)} — Confidential. Generated by the Operations Platform.</span><span>${esc(nowStr())}</span></div>
  </div>
  <script>window.onload=function(){setTimeout(function(){window.focus();window.print();},300);};<\/script>

  w.document.open(); w.document.write(html); w.document.close();
}

/* ---- PDF (downloadable + printable) rendering via jsPDF + autotable ---- */
// jsPDF core fonts use WinAnsi encoding and cannot render ₦, arrows, etc.
// Map those to safe ASCII so PDFs are correct and legible.
function pdfSafe(s){
  return String(s==null?'':s)
    .replace(/₦/g,'NGN ')
    .replace(/→/g,'->').replace(/×/g,'x')
    .replace(/≥/g,'>=').replace(/≤/g,'<=')
    .replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
    .replace(/[—–]/g,'-')
    .replace(/✓/g,'[OK]').replace(/[✗✕]/g,'[X]')
    .replace(/[·•]/g,'-')
    .replace(/[^\x00-\xFF]/g,'').trim();
}
function pdfCell(c){
  if (c && typeof c==='object'){
    if (c.status){ const k=RPT_KINDS[c.status]||RPT_KINDS.neutral; return { content:pdfSafe(c.text), styles:{ textColor:k.pdf, fontStyle:'bold', halign:'center' } }; }
    if (c.num) return { content:pdfSafe(c.text), styles:{ halign:'right' } };
  }
  return { content: pdfSafe(c) };
}
function buildReportDoc(meta, sections){
  const { jsPDF } = window.jspdf || {};
  if (!jsPDF){ alert('PDF engine still loading — please try again in a moment.'); return null; }
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 40;
  const drawHeader = () => {
    doc.setFillColor(200,129,26); doc.rect(0,0,W,6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(26,29,36);
    doc.text(pdfSafe(COMPANY), M, 34);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90,99,115);
    doc.text(pdfSafe(COMPANY_SUB + ' - Official Report'), M, 47);
    doc.setDrawColor(200,129,26); doc.setLineWidth(2); doc.line(M,54,W-M,54);
  };
  drawHeader();
  let y = 74;
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(17,17,17);
  doc.text(pdfSafe(meta.title), M, y);
  if (meta.status){
    doc.setFontSize(9); doc.setTextColor(...(meta.statusPdf||[74,82,98]));
    doc.text(pdfSafe(meta.status.text), W-M, y, { align:'right' });
  }
  y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,99,115);
  const metaText = (meta.metaItems||[]).map(m=>`${m[0]}: ${m[1]}`).join('    -    ');
  const metaLines = doc.splitTextToSize(pdfSafe(metaText), W-2*M);
  doc.text(metaLines, M, y); y += metaLines.length*11 + 8;

  sections.forEach(s=>{
    if (s.kpis){
      doc.autoTable({
        startY:y, margin:{left:M,right:M},
        body: s.kpis.map(k=>[{content:pdfSafe(k.label), styles:{fontStyle:'bold', textColor:[58,47,24]}}, {content:pdfSafe(k.value + (k.sub?`  (${k.sub})`:'')), styles:{halign:'right'}}]),
        theme:'grid', styles:{ fontSize:9.5, cellPadding:5, lineColor:[215,219,227], textColor:[26,29,36] },
        columnStyles:{ 0:{cellWidth:(W-2*M)*0.55}, 1:{cellWidth:(W-2*M)*0.45} },
        tableLineColor:[215,219,227],
      });
      y = doc.lastAutoTable.finalY + 12;
    } else if (s.head){
      if (s.title){ doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(17,17,17); doc.text(pdfSafe(s.title), M, y); y += 6; }
      doc.autoTable({
        startY:y, margin:{left:M,right:M},
        head:[ s.head.map(h=>{ const o=typeof h==='object'; return { content:pdfSafe(o?h.label:h), styles:{ halign:(o&&h.num)?'right':'left' } }; }) ],
        body:(s.rows||[]).map(r=>r.map(pdfCell)),
        theme:'striped',
        headStyles:{ fillColor:[240,237,230], textColor:[58,47,24], fontStyle:'bold', fontSize:8.5, lineColor:[215,219,227], lineWidth:0.5 },
        styles:{ fontSize:8.7, cellPadding:4, textColor:[26,29,36], lineColor:[226,229,236], lineWidth:0.4 },
        alternateRowStyles:{ fillColor:[250,251,252] },
      });
      y = doc.lastAutoTable.finalY + 14;
    } else if (s.note!=null){
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90,99,115);
      const noteLines = doc.splitTextToSize(pdfSafe(s.note), W-2*M);
      if (y + noteLines.length*11 > doc.internal.pageSize.getHeight()-60){ doc.addPage(); drawHeader(); y=74; }
      doc.setFillColor(247,248,250); doc.setDrawColor(226,229,236);
      doc.roundedRect(M, y-4, W-2*M, noteLines.length*11 + 12, 4, 4, 'FD');
      doc.text(noteLines, M+8, y+8); y += noteLines.length*11 + 20;
    }
  });

  // Footer on every page
  const pages = doc.internal.getNumberOfPages();
  for (let p=1;p<=pages;p++){
    doc.setPage(p);
    const H = doc.internal.pageSize.getHeight();
    doc.setDrawColor(215,219,227); doc.setLineWidth(0.5); doc.line(M,H-32,W-M,H-32);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(122,130,144);
    doc.text(pdfSafe(`${COMPANY} - Confidential. Generated ${nowStr()}.`), M, H-20);
    doc.text(`Page ${p} of ${pages}`, W-M, H-20, { align:'right' });
  }
  return doc;
}
function downloadReportPdf(meta, sections, filename){
  const doc = buildReportDoc(meta, sections);
  if (doc) doc.save(filename || 'ugomba-report.pdf');
}
function ReportActions({ meta, sections, filename }){
  return (
    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
      <button className="btn btn-blue" onClick={()=>downloadReportPdf(meta, sections, filename)}>⬇ Download PDF</button>
      <button className="btn btn-ghost" onClick={()=>openPrintableReport(meta, sections)}>⎙ Print</button>
    </div>
  );
}

/* ── ROLE GUARD ── */
/* Runtime permission set — kept in sync with App state so admins can edit the
   permission matrix and have it take effect immediately. */
let ACTIVE_PERMISSIONS = { ...DEFAULT_PERMISSIONS };
function canAccessPage(user, perm) {
  if (!user) return false;
  if (user.role === 'superadmin' || user.role === 'admin') return true;
  const perms = ACTIVE_PERMISSIONS[user.custom_role] || {};
  return !!perms[perm];
}
function canByPosition(user, minPos) {
  return posLevel(user?.position) >= posLevel(minPos);
}

  const totalOil = approved.reduce((s,b)=>s+(b.oil_volume||0),0);

/* ══════════════════════════════════════════════════════════
   NAOH CALCULATOR
══════════════════════════════════════════════════════════ */
function NaOHCalc({ user, batches, setBatches, inventory, setInventory, addAudit, showToast }) {
  const [oilVol, setOilVol] = useState('');
  const [ffaPct, setFfaPct] = useState('');
  const [oilType, setOilType] = useState('Palm Oil');
  const [result, setResult] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  const calculate = () => {
    const vol = parseFloat(oilVol), ffa = parseFloat(ffaPct);
    if (!vol || !ffa || vol <= 0 || ffa <= 0) return;
    const factor = OIL_FACTORS[oilType] || 1;
    const naoh_theoretical = (vol * ffa * 0.142 * factor) / 1000;
    const naoh_excess = naoh_theoretical * 1.15;
    const lye_volume = naoh_excess / 0.16;
    const water_volume = lye_volume - naoh_excess;
    const temp_range = '55–65°C';
    const mixing_time = '20–30 min';
    setResult({ naoh_theoretical, naoh_excess, lye_volume, water_volume, temp_range, mixing_time, vol, ffa, oilType });
    setSubmitted(false);
  };

  const submit = () => {
    if (!result) return;
    const id = newBatchId(result.oilType, batches);
    const batch = { id, type:'NaOH', date:todayStr(), operator:user.name, status:'pending', oil_volume:result.vol, oil_type:result.oilType, ffa:result.ffa, naoh_kg:parseFloat(result.naoh_excess.toFixed(3)), approver:null };
    setBatches(p=>[...p,batch]);
    addAudit(`Submitted NaOH batch ${id} for approval — ${result.vol}L ${oilType} @ ${result.ffa}% FFA, NaOH: ${result.naoh_excess.toFixed(3)}kg`,'info','batch');
    setSubmitted(true);
    showToast(`Batch ${id} submitted for approval`);
  };

  const histNaOH = batches.filter(b=>b.type==='NaOH' && !b.archived);

  return (
    <div>
      <div className="page-heading mb-4">NaOH Dosage Calculator</div>
      <div className="page-sub mb-16">Calculates caustic soda (NaOH) required for chemical refining of vegetable oil based on FFA content</div>

      <div className="card">
        <div className="section-title">Calculation Parameters</div>
        <div className="form-grid cols-4 mb-16">
          <div className="field">
            <label>Oil Volume (Litres)</label>
            <input type="number" value={oilVol} onChange={e=>setOilVol(e.target.value)} placeholder="e.g. 5000" min="1"/>
          </div>
          <div className="field">
            <label>FFA Content (%)</label>
            <input type="number" step="0.01" value={ffaPct} onChange={e=>setFfaPct(e.target.value)} placeholder="e.g. 1.5" min="0.01" max="20"/>
            <span className="field-hint">Free Fatty Acid percentage from titration</span>
          </div>
          <div className="field">
            <label>Oil Type</label>
            <select value={oilType} onChange={e=>setOilType(e.target.value)}>
              {Object.keys(OIL_FACTORS).map(o=><option key={o}>{o}</option>)}
            </select>
          </div>
          <div className="field">
            <label>&nbsp;</label>
            <button className="btn btn-primary" onClick={calculate} disabled={!oilVol||!ffaPct}>Calculate Dosage</button>
          </div>
        </div>

        {result && (
          <div className="result-box">
            <div className="result-box-title">NaOH Dosage Results — {fmtN(result.vol)}L {result.oilType} @ {result.ffa}% FFA</div>
            <div className="result-grid">
              <div className="result-item">
                <div className="ri-label">Theoretical NaOH</div>
                <div className="ri-value">{fmt(result.naoh_theoretical,3)}<span className="ri-unit">kg</span></div>
              </div>
              <div className="result-item" style={{borderColor:'var(--accent)',border:'1px solid rgba(245,166,35,.3)'}}>
                <div className="ri-label">NaOH Required (+15% excess)</div>
                <div className="ri-value" style={{color:'var(--accent)'}}>{fmt(result.naoh_excess,3)}<span className="ri-unit">kg</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Lye Solution Volume</div>
                <div className="ri-value">{fmt(result.lye_volume,2)}<span className="ri-unit">L</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Water Required</div>
                <div className="ri-value">{fmt(result.water_volume,2)}<span className="ri-unit">L</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Temperature Range</div>
                <div className="ri-value" style={{fontSize:14}}>{result.temp_range}</div>
              </div>
              <div className="result-item">
                <div className="ri-label">Mixing Time</div>
                <div className="ri-value" style={{fontSize:14}}>{result.mixing_time}</div>
              </div>
            </div>
            <div className="alert alert-info" style={{marginBottom:12}}>
              <span className="alert-icon">ℹ</span>
              Dissolve {fmt(result.naoh_excess,3)}kg NaOH in {fmt(result.water_volume,2)}L water to prepare 16% w/v lye solution. Add slowly to oil at {result.temp_range} with continuous agitation.
            </div>
            {submitted
              ? <div className="alert alert-success"><span className="alert-icon">✓</span>Batch submitted for manager approval. Check the Approval Queue.</div>
              : <button className="btn btn-primary" onClick={submit}>Submit for Approval</button>
            }
          </div>
        )}
      </div>

      <div className="card">
        <div className="section-title">NaOH Batch History ({histNaOH.length})</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Batch ID</th><th>Date</th><th>Oil Type</th><th>Volume (L)</th><th>FFA (%)</th><th>NaOH (kg)</th><th>Operator</th><th>Status</th><th>Approver</th></tr></thead>
            <tbody>
              {[...histNaOH].reverse().map(b=>(
                <tr key={b.id}>
                  <td className="td-mono">{b.id}</td>
                  <td className="td-muted">{b.date}</td>
                  <td>{b.oil_type||'—'}</td>
                  <td className="td-mono">{fmtN(b.oil_volume)}</td>
                  <td className="td-mono">{b.ffa}</td>
                  <td className="td-mono">{b.naoh_kg}</td>
                  <td>{b.operator}</td>
                  <td><span className={`badge badge-${b.status}`}>{b.status.toUpperCase()}</span></td>
                  <td className="td-muted">{b.approver||'—'}</td>
                </tr>
              ))}
              {histNaOH.length===0 && <tr><td colSpan={9} className="empty-state">No NaOH batches yet</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PHOSPHORIC ACID CALCULATOR
══════════════════════════════════════════════════════════ */
function PhosphoricCalc({ user, batches, setBatches, inventory, setInventory, addAudit, showToast }) {
  const [oilVol, setOilVol] = useState('');
  const [ironPpm, setIronPpm] = useState('2');
  const [oilType, setOilType] = useState('Soybean Oil');
  const [result, setResult] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  const calculate = () => {
    const vol = parseFloat(oilVol), iron = parseFloat(ironPpm)||2;
    if (!vol||vol<=0) return;
    const oil_tons = (vol * 0.92) / 1000;
    const acid_ml_per_ton = (iron * 0.8 + 1.2) * 10;
    const acid_total_ml = acid_ml_per_ton * oil_tons;
    const acid_diluted_ml = acid_total_ml / 0.85;
    const water_ml = acid_diluted_ml - acid_total_ml;
    setResult({ acid_total_ml, acid_diluted_ml, water_ml, oil_tons, vol });
    setSubmitted(false);
  };

  const submit = () => {
    if (!result) return;
    const id = newBatchId(oilType, batches);
    const batch = { id, type:'Phosphoric', date:todayStr(), operator:user.name, status:'pending', oil_volume:result.vol, oil_type:oilType, acid_ml:parseFloat(result.acid_total_ml.toFixed(1)), approver:null };
    setBatches(p=>[...p,batch]);
    addAudit(`Submitted Phosphoric batch ${id} for approval — ${result.vol}L oil, ${result.acid_total_ml.toFixed(1)}mL H₃PO₄`,'info','batch');
    setSubmitted(true);
    showToast(`Batch ${id} submitted`);
  };

  const hist = batches.filter(b=>b.type==='Phosphoric' && !b.archived);

  return (
    <div>
      <div className="page-heading mb-4">Phosphoric Acid Degumming Calculator</div>
      <div className="page-sub mb-16">Calculates H₃PO₄ (85%) dosage for degumming and removing trace metals from crude oil</div>

      <div className="card">
        <div className="section-title">Calculation Parameters</div>
        <div className="form-row">
          <div className="field">
            <label>Oil Volume (Litres)</label>
            <input type="number" value={oilVol} onChange={e=>setOilVol(e.target.value)} placeholder="e.g. 5000"/>
          </div>
          <div className="field">
            <label>Iron Content (ppm)</label>
            <input type="number" step="0.1" value={ironPpm} onChange={e=>setIronPpm(e.target.value)} placeholder="default: 2 ppm"/>
            <span className="field-hint">From metals analysis; default 2ppm if unknown</span>
          </div>
          <div className="field">
            <label>Oil Line</label>
            <select value={oilType} onChange={e=>setOilType(e.target.value)}>
              {Object.keys(OIL_FACTORS).map(o=><option key={o}>{o}</option>)}
            </select>
            <span className="field-hint">Batch no. line: {lineCode(oilType)}</span>
          </div>
          <div className="field" style={{maxWidth:160,minWidth:120}}>
            <label>&nbsp;</label>
            <button className="btn btn-primary" onClick={calculate} disabled={!oilVol}>Calculate</button>
          </div>
        </div>

        {result && (
          <div className="result-box">
            <div className="result-box-title">Phosphoric Acid Degumming Parameters — {fmtN(result.vol)}L Oil</div>
            <div className="result-grid">
              <div className="result-item" style={{border:'1px solid rgba(245,166,35,.3)'}}>
                <div className="ri-label">H₃PO₄ Required (85%)</div>
                <div className="ri-value" style={{color:'var(--accent)'}}>{fmt(result.acid_total_ml,1)}<span className="ri-unit">mL</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Diluted Acid Volume</div>
                <div className="ri-value">{fmt(result.acid_diluted_ml,1)}<span className="ri-unit">mL</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Water for Dilution</div>
                <div className="ri-value">{fmt(result.water_ml,1)}<span className="ri-unit">mL</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Oil Mass</div>
                <div className="ri-value">{fmt(result.oil_tons,3)}<span className="ri-unit">tonnes</span></div>
              </div>
              <div className="result-item">
                <div className="ri-label">Contact Time</div>
                <div className="ri-value" style={{fontSize:14}}>15–20 min</div>
              </div>
              <div className="result-item">
                <div className="ri-label">Temperature</div>
                <div className="ri-value" style={{fontSize:14}}>60–70°C</div>
              </div>
            </div>
            <div className="alert alert-info" style={{marginBottom:12}}>
              <span className="alert-icon">ℹ</span>
              Dilute {fmt(result.acid_total_ml,1)}mL H₃PO₄ with {fmt(result.water_ml,1)}mL water before addition. Add at 60–70°C with vigorous agitation. Stir for 15–20 min before centrifugation.
            </div>
            {submitted
              ? <div className="alert alert-success"><span className="alert-icon">✓</span>Submitted for approval.</div>
              : <button className="btn btn-primary" onClick={submit}>Submit for Approval</button>
            }
          </div>
        )}
      </div>

      <div className="card">
        <div className="section-title">Phosphoric Batch History ({hist.length})</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Batch ID</th><th>Date</th><th>Oil Vol (L)</th><th>Acid (mL)</th><th>Operator</th><th>Status</th></tr></thead>
            <tbody>
              {[...hist].reverse().map(b=>(
                <tr key={b.id}>
                  <td className="td-mono">{b.id}</td>
                  <td className="td-muted">{b.date}</td>
                  <td className="td-mono">{fmtN(b.oil_volume)}</td>
                  <td className="td-mono">{b.acid_ml}</td>
                  <td>{b.operator}</td>
                  <td><span className={`badge badge-${b.status}`}>{b.status.toUpperCase()}</span></td>
                </tr>
              ))}
              {hist.length===0&&<tr><td colSpan={6} className="empty-state">No phosphoric batches yet</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   VITAMIN A CALCULATOR
══════════════════════════════════════════════════════════ */
function VitaminACalc({ user, batches, setBatches, inventory, setInventory, addAudit, showToast }) {
  const [oilVol, setOilVol] = useState('');
  const [targetConc, setTargetConc] = useState('11');
  const [stockConc, setStockConc] = useState('500000');
  const [oilType, setOilType] = useState('Soybean Oil');
  const [result, setResult] = useState(null);
  const [submitted, setSubmitted] = useState(false);

  const calculate = () => {
    const vol = parseFloat(oilVol), target = parseFloat(targetConc), stock = parseFloat(stockConc);
    if (!vol||!target||!stock) return;
    const oil_kg = vol * 0.92;
    const total_IU = oil_kg * target * 1000;   // grams of oil × IU/g
    const vitA_g = total_IU / stock;            // grams of concentrate (IU ÷ IU/g)
    const vitA_g_excess = vitA_g * 1.10;
    const isCompliant = target >= 11;
    setResult({ vitA_g, vitA_g_excess, total_IU, oil_kg, target, isCompliant, vol });
    setSubmitted(false);

  const submit = () => {
    if (!result) return;
    const id = newBatchId(oilType, batches);
    const batch = { id, type:'VitaminA', date:todayStr(), operator:user.name, status:'pending', oil_volume:result.vol, oil_type:oilType, target_conc:result.target, vitA_g:parseFloat(result.vitA_g_excess.toFixed(2)), approver:null };

    addAudit(`Submitted VitaminA batch ${id} for approval — ${result.vol}L oil, ${result.vitA_g_excess.toFixed(2)}g Vit A @ ${result.target} IU/g`,'info','batch');

            <label>Target Conc. (IU/g)</label>
            <input type="number" step="0.5" value={targetConc} onChange={e=>setTargetConc(e.target.value)}/>

            <select value={oilType} onChange={e=>setOilType(e.target.value)}>
              {Object.keys(OIL_FACTORS).map(o=><option key={o}>{o}</option>)}
            </select>
            <span className="field-hint">Batch no. line: {lineCode(oilType)}</span>
          </div>
        </div>
        <div style={{marginTop:12}}>

                  {result.isCompliant?'✓ Pass':'✗ Fail'}
                </div>
              </div>
            </div>
            {!result.isCompliant && (
              <div className="alert alert-danger" style={{marginBottom:12}}>
                <span className="alert-icon">✕</span>
                Target concentration {result.target} IU/g is below the NAFDAC minimum of 11 IU/g. Increase target concentration before submission.
              </div>
            )}
            {submitted
              ? <div className="alert alert-success"><span className="alert-icon">✓</span>Submitted for approval.</div>
              : <button className="btn btn-primary" onClick={submit} disabled={!result.isCompliant}>Submit for Approval</button>
            }
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PRICE SETTING CALCULATOR
   Builds a full unit-cost (overhead-inclusive) model and derives
   recommended selling prices to each channel (distributor →
   wholesaler → retailer → consumer) for every retail pack size,
   plus an auto-updating (weekly, every Tuesday) competitor benchmark.
══════════════════════════════════════════════════════════ */
const PACK_SIZES = [
  { label:'40 cl', litres:0.4 },
  { label:'1.5 L', litres:1.5 },
  { label:'2.5 L', litres:2.5 },
  { label:'5 L',   litres:5 },
  { label:'25 L',  litres:25 },
];

function PriceCalculator({ user }) {
  const DAYS_PER_MONTH = 30;
  const [oilType, setOilType] = useState('Soybean');
  const [batchSize, setBatchSize] = useState('30000');   // litres of finished oil per batch
  const [batchDays, setBatchDays] = useState('3');        // a batch lasts ~2–3 days
  // Fixed monthly labour & operations (₦ / month) — from the provided overhead sheet (editable)
  const [ovh, setOvh] = useState({
    manager:250000, marketing:200000, cleaner:40000, security:120000,
    receptionist:90000, analyst:180000, transportation:150000,
  });
  // Power is generated from a diesel plant: ~₦300,000 of diesel every 3 days (editable)
  const [dieselSpend, setDieselSpend] = useState('300000');
  const [dieselDays, setDieselDays]   = useState('3');
  // Raw material & packaging (bulk purchase → effective ₦ per finished litre)
  const [rawMaterial, setRawMaterial] = useState('3100'); // ₦/L of finished oil
  const [bottleCost, setBottleCost]   = useState('500');  // ₦/L packaging
  // We buy chemicals in BULK and use only a small dose per litre. Cost/L is
  // computed automatically as (bulk unit price) × (dose used per litre).
  // NaOH is auto-derived from the batch neutralisation requirement (FFA-driven).
  const [ffaPct, setFfaPct]                 = useState('1.5');   // % free fatty acid
  const [naohPricePerKg, setNaohPricePerKg] = useState('1200');  // bulk ₦/kg
  const [acidType, setAcidType]             = useState('Phosphoric'); // Phosphoric | Citric | Both
  const [phosPricePerL, setPhosPricePerL]   = useState('3500');  // bulk ₦/L
  const [phosIronPpm, setPhosIronPpm]       = useState('2');     // iron ppm → auto dose (as in Phosphoric calc)
  const [citricPricePerKg, setCitricPricePerKg] = useState('2200'); // bulk ₦/kg
  const [citricPct, setCitricPct]           = useState('0.1');   // % of oil weight → auto dose
  const [vitTargetIU, setVitTargetIU] = useState('11');           // IU/g (NAFDAC min)
  const [vitStockIU, setVitStockIU]   = useState('500000');       // concentrate potency IU/g
  const [vitPricePerKg, setVitPricePerKg] = useState('85000');    // bulk ₦/kg
  const [profitPct, setProfitPct]     = useState('20');
  const [distMargin, setDistMargin]   = useState('8');
  const [wholeMargin, setWholeMargin] = useState('12');
  const [retailMargin, setRetailMargin] = useState('25');
  const [outputVol, setOutputVol]     = useState('');     // total finished output for a run (defaults to monthly)
  const [customOvh, setCustomOvh]     = useState([]);     // extra monthly overhead lines [{id,label,amount}]

  const [competitors] = useState(() => {
    const t = mostRecentTuesday(); const key = t.toISOString().slice(0,10);
    const stored = LS.get('competitors', null);
    if (stored && stored.tuesday === key && stored.v === 2) return stored;
    const fresh = { v:2, tuesday:key, updatedAt: nowStr(), prices: weeklyCompetitorPrices(t) };
    LS.set('competitors', fresh);
    return fresh;
  });

  const num = (v) => parseFloat(v) || 0;
  const setOv = (k,v) => setOvh(o=>({...o, [k]:v}));   // store raw string so the field clears/edits smoothly
  const addCustomOvh    = () => setCustomOvh(list=>[...list, {id:'co'+Date.now(), label:'', amount:''}]);
  const updateCustomOvh = (id, patch) => setCustomOvh(list=>list.map(x=>x.id===id?{...x,...patch}:x));
  const removeCustomOvh = (id) => setCustomOvh(list=>list.filter(x=>x.id!==id));

  // Production basis — labour/overheads are paid monthly but a batch lasts 2–3 days.
  // International best practice (absorption / full-cost costing): spread fixed monthly
  // cost across the units of finished product produced that month.
  const batchesPerMonth = num(batchDays)>0 ? DAYS_PER_MONTH/num(batchDays) : 0;
  const monthlyVol = num(batchSize) * batchesPerMonth;

  // Electricity from diesel: cost/day derived from spend-per-cycle, then monthly.
  const dieselPerDay  = num(dieselDays)>0 ? num(dieselSpend)/num(dieselDays) : 0;
  const dieselMonthly = dieselPerDay * DAYS_PER_MONTH;

  const salaryKeys = ['manager','marketing','cleaner','security','receptionist','analyst'];
  const labourMonthly    = salaryKeys.reduce((s,k)=>s+num(ovh[k]),0);
  const transportMonthly = num(ovh.transportation);
  const customMonthly    = customOvh.reduce((s,x)=>s+num(x.amount),0);
  const fixedMonthly     = labourMonthly + transportMonthly + dieselMonthly + customMonthly;

  const per = (monthly) => monthlyVol>0 ? monthly/monthlyVol : 0;
  const labourPerL    = per(labourMonthly);
  const transportPerL = per(transportMonthly);
  const dieselPerL    = per(dieselMonthly);
  const customPerL    = per(customMonthly);
  const overheadPerL  = labourPerL + transportPerL + dieselPerL + customPerL;

  // Chemicals: bulk unit price × small dose per litre (only a little is used).
  const oilFactor = { Soybean:0.98, Groundnut:1.02 }[oilType] || 1;
  const naohKgPerL  = num(ffaPct) * 0.142 * oilFactor * 1.15 / 1000;   // kg NaOH / L (incl. 15% excess)
  const naohKgPerBatch = naohKgPerL * num(batchSize);
  const naohCostPerL = naohKgPerL * num(naohPricePerKg);              // auto-calculated
  const usePhos   = acidType==='Phosphoric' || acidType==='Both';
  const useCitric = acidType==='Citric'     || acidType==='Both';
  // Phosphoric dose auto-derived from iron content (same basis as the Phosphoric Acid calculator)
  const phosDoseMlPerL = usePhos ? (num(phosIronPpm)*0.8 + 1.2)*10 * 0.92/1000 : 0; // mL H₃PO₄ per L oil
  const phosCostPerL   = phosDoseMlPerL * (num(phosPricePerL)/1000);                // mL/L × ₦/mL
  // Citric dose auto-derived from dosing rate (% of oil weight; ~920 g oil per finished L)
  const citricDoseGPerL = useCitric ? (num(citricPct)/100) * 920 : 0;               // g per L oil
  const citricCostPerL  = (citricDoseGPerL/1000) * num(citricPricePerKg);           // kg/L × ₦/kg
  const acidCostPerL   = phosCostPerL + citricCostPerL;
  const vitDoseGPerL   = num(vitStockIU)>0 ? (0.92*1000*num(vitTargetIU)/num(vitStockIU))*1.10 : 0; // g/L incl. 10% excess
  const vitCostPerL    = vitDoseGPerL * (num(vitPricePerKg)/1000);    // g/L × ₦/g
  const chemPerL     = naohCostPerL + acidCostPerL + vitCostPerL;
  const variablePerL = num(rawMaterial) + chemPerL + num(bottleCost);
  const costPerL     = variablePerL + overheadPerL;
  const exFactoryPerL= costPerL * (1 + num(profitPct)/100);   // our price to distributor
  const profitPerL   = exFactoryPerL - costPerL;

  const distPerL     = exFactoryPerL;
  const wholePerL    = distPerL  * (1 + num(distMargin)/100);
  const retailPerL   = wholePerL * (1 + num(wholeMargin)/100);
  const consumerPerL = retailPerL* (1 + num(retailMargin)/100);

  const channels = [
    { key:'Distributor (Ex-Factory)', perL:distPerL },
    { key:'Wholesaler',  perL:wholePerL },
    { key:'Retailer',    perL:retailPerL },
    { key:'Consumer (RRP)', perL:consumerPerL },
  ];

  const costItems = [
    ['Raw Material (Oil)', num(rawMaterial)],
    ['NaOH (neutralisation, auto)', naohCostPerL],
    ...(usePhos   ? [['Phosphoric Acid (degumming)', phosCostPerL]] : []),
    ...(useCitric ? [['Citric Acid (degumming)', citricCostPerL]] : []),
    ['Vitamin A Fortification', vitCostPerL],
    ['Bottle / Packaging', num(bottleCost)],
    ['Labour (amortised)', labourPerL],
    ['Transportation (amortised)', transportPerL],
    ['Power / Diesel (amortised)', dieselPerL],
    ...(customMonthly>0 ? [['Other Overhead (amortised)', customPerL]] : []),
  ];

  // Expected profit for a production run based on total finished output volume.
  const outVol = num(outputVol) || monthlyVol;
  const totalCost      = costPerL*outVol;
  const totalExFactory = exFactoryPerL*outVol;
  const totalProfit    = profitPerL*outVol;
  const totalRRP       = consumerPerL*outVol;
  const rrpProfit      = (consumerPerL-costPerL)*outVol;

  const compAvg = competitors.prices.reduce((s,c)=>s+c.price,0) / (competitors.prices.length||1);
  const vsAvg = compAvg>0 ? ((consumerPerL - compAvg)/compAvg)*100 : 0;

  const ovhLabels = {
    manager:'Manager', marketing:'Marketing Manager', cleaner:'Cleaner', security:'Security Guards',
    receptionist:'Receptionist / Asst. Floor Mgr', analyst:'Food Processing Analyst',
    transportation:'Transportation',
  };

  const reportMeta = {
    title:'Price Setting & Channel Pricing Report',
    metaItems:[['Company',COMPANY],['Product',`${oilType} Oil`],['Monthly Output',fmtN(monthlyVol)+' L'],['Profit Target',profitPct+'%'],...reportMetaBase(user)],
  };
  const reportSections = [
    { kpis:[
      { label:'Production Cost / L', value:'₦'+fmt(costPerL,2), sub:`${oilType} oil` },
      { label:'Ex-Factory Price / L', value:'₦'+fmt(exFactoryPerL,2), sub:`incl. ${profitPct}% profit` },
      { label:'Profit / L', value:'₦'+fmt(profitPerL,2) },
      { label:'Recommended Consumer / L', value:'₦'+fmt(consumerPerL,2), sub:(vsAvg>=0?'+':'')+vsAvg.toFixed(1)+'% vs market' },
    ]},
    { title:'Unit Cost Build-up (per litre)',
      head:['Cost Component',{label:'₦ / Litre',num:true},{label:'Share',num:true}],
      rows:[...costItems.map(([l,v])=>[l,{num:true,text:fmt(v,2)},{num:true,text:(costPerL?((v/costPerL)*100).toFixed(1):'0.0')+'%'}]),
        ['Total Cost / Litre',{num:true,text:fmt(costPerL,2)},{num:true,text:'100.0%'}]] },
    { title:`Expected Profit — ${fmtN(outVol)} L finished output`,
      head:['Basis',{label:'Total (₦)',num:true}],
      rows:[
        ['Total Production Cost',{num:true,text:fmtN(totalCost)}],
        ['Ex-Factory Revenue (sold to distributors)',{num:true,text:fmtN(totalExFactory)}],
        ['Expected Profit (at ex-factory)',{num:true,text:fmtN(totalProfit)}],
        ['Revenue if sold at Consumer RRP',{num:true,text:fmtN(totalRRP)}],
        ['Profit if sold at Consumer RRP',{num:true,text:fmtN(rrpProfit)}],
      ] },
    { title:'Recommended Prices by Pack Size & Channel',
      head:['Pack Size', {label:'Production Cost (₦)',num:true}, ...channels.map(c=>({label:c.key+' (₦)',num:true}))],
      rows: PACK_SIZES.map(p=>[p.label, {num:true,text:fmtN(costPerL*p.litres)}, ...channels.map(c=>({num:true,text:fmtN(c.perL*p.litres)}))]) },
    { note:`Production Cost is the pre-profit unit cost per pack. Ex-Factory (what a Distributor pays us) = production cost + ${profitPct}% target profit — hence the Distributor column sits above Production Cost. Each later tier then adds its margin: +${distMargin}% -> Wholesaler, +${wholeMargin}% -> Retailer, +${retailMargin}% -> Consumer. Fixed monthly labour and overheads are absorbed across monthly output (${fmt(batchesPerMonth,1)} batches/month x ${fmtN(num(batchSize))} L).` },
    { title:`Competitor Benchmark — consumer price by pack (auto-updated ${longDate(competitors.tuesday)})`,
      head:['Brand', ...PACK_SIZES.map(p=>({label:p.label+' (₦)',num:true}))],
      rows: competitors.prices.map(c=>[c.name, ...PACK_SIZES.map(p=>({num:true,text:fmtN(c.price*p.litres)}))])
        .concat([['Ugomba Noel Ltd (our RRP)', ...PACK_SIZES.map(p=>({num:true,text:fmtN(consumerPerL*p.litres)}))]]) },
    { note:`Competitor pack prices are derived from each brand's per-litre price and are indicative market data refreshed automatically every Tuesday. Next scheduled update: ${longDate(nextTuesday())}.` },
  ];

  const OvField = ({k}) => (
    <div className="field"><label>{ovhLabels[k]} (₦/mo)</label>
      <input type="number" value={ovh[k]} onChange={e=>setOv(k,e.target.value)}/></div>
  );

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading">Price Setting Calculator</div>
          <div className="page-sub">Overhead-inclusive unit costing &amp; recommended channel pricing for {oilType.toLowerCase()} oil</div>
        </div>
        <ReportActions meta={reportMeta} sections={reportSections} filename={`Price-Setting-Report-${todayStr()}.pdf`}/>
      </div>

      <div className="alert alert-info mb-16">
        <span className="alert-icon">ℹ</span>
        <div>Prices cascade from the ex-factory price using international best-practice trade margins
        (<strong>Distributor → Wholesaler → Retailer → Consumer</strong>). Monthly labour and overheads are <strong>absorbed per litre</strong> across the output you actually produce each month (a batch lasts ~2–3 days), and power is derived from your <strong>diesel</strong> spend. All inputs below are editable.</div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="section-title">Production Basis</div>
          <div className="form-grid cols-2 mb-8">
            <div className="field"><label>Oil Type</label>
              <select value={oilType} onChange={e=>{const t=e.target.value;setOilType(t);setRawMaterial(t==='Groundnut'?'3300':'3100');}}>
                <option>Soybean</option><option>Groundnut</option>
              </select>
            </div>
            <div className="field"><label>Batch Size (L / batch)</label><input type="number" value={batchSize} onChange={e=>setBatchSize(e.target.value)}/></div>
            <div className="field"><label>Batch Duration (days)</label><input type="number" step="0.5" value={batchDays} onChange={e=>setBatchDays(e.target.value)}/><span className="field-hint">A batch lasts ~2–3 days</span></div>
            <div className="field"><label>&nbsp;</label>
              <div className="inline-info" style={{padding:'6px 0'}}><span className="ii-label">Batches / month</span><span className="ii-value">{fmt(batchesPerMonth,1)}</span></div>
            </div>
          </div>
          <div className="inline-info" style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
            <span className="ii-label">Monthly finished output</span>
            <span className="ii-value" style={{color:'var(--accent)'}}>{fmtN(monthlyVol)} L</span>
          </div>

          <div className="section-title" style={{marginTop:16}}>Raw Material &amp; Packaging (₦ per finished litre)</div>
          <div className="form-grid cols-2">
            <div className="field"><label>Raw Material — Oil (₦/L)</label><input type="number" value={rawMaterial} onChange={e=>setRawMaterial(e.target.value)}/></div>
            <div className="field"><label>Bottle / Packaging (₦/L)</label><input type="number" value={bottleCost} onChange={e=>setBottleCost(e.target.value)}/></div>
          </div>

          <div className="section-title" style={{marginTop:16}}>Chemicals — bought in bulk, dosed per litre</div>
          <div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>Enter each <strong>bulk unit price</strong>; the small dose used per litre — and hence the cost per litre — is <strong>auto-calculated</strong> from process parameters: NaOH from FFA, phosphoric acid from iron content, citric acid from its dosing rate, and Vitamin A from the target IU.</div>
          <div className="form-grid cols-2">
            <div className="field"><label>FFA of crude oil (%)</label><input type="number" step="0.1" value={ffaPct} onChange={e=>setFfaPct(e.target.value)}/><span className="field-hint">Drives the NaOH dose</span></div>
            <div className="field"><label>NaOH bulk price (₦/kg)</label><input type="number" value={naohPricePerKg} onChange={e=>setNaohPricePerKg(e.target.value)}/></div>
          </div>
          <div className="inline-info"><span className="ii-label">NaOH required / batch ({fmtN(num(batchSize))} L)</span><span className="ii-value">{fmt(naohKgPerBatch,2)} kg</span></div>
          <div className="inline-info"><span className="ii-label">NaOH cost / litre (auto)</span><span className="ii-value" style={{color:'var(--accent)'}}>₦{fmt(naohCostPerL,3)}</span></div>

          <div className="form-grid cols-2" style={{marginTop:10}}>
            <div className="field"><label>Degumming Acid</label>
              <select value={acidType} onChange={e=>setAcidType(e.target.value)}>
                <option>Phosphoric</option><option>Citric</option><option>Both</option>
              </select>
              <span className="field-hint">Phosphoric, citric, or both</span>
            </div>
            <div className="field"><label>&nbsp;</label>
              <div className="inline-info" style={{padding:'6px 0'}}><span className="ii-label">Acid cost / L</span><span className="ii-value">₦{fmt(acidCostPerL,3)}</span></div>
            </div>
            {usePhos && <div className="field"><label>Iron content (ppm)</label><input type="number" step="0.1" value={phosIronPpm} onChange={e=>setPhosIronPpm(e.target.value)}/><span className="field-hint">Auto dose {fmt(phosDoseMlPerL,4)} mL/L → ₦{fmt(phosCostPerL,3)}/L</span></div>}
            {usePhos && <div className="field"><label>Phosphoric bulk (₦/L)</label><input type="number" value={phosPricePerL} onChange={e=>setPhosPricePerL(e.target.value)}/></div>}
            {useCitric && <div className="field"><label>Citric dose (% oil wt)</label><input type="number" step="0.01" value={citricPct} onChange={e=>setCitricPct(e.target.value)}/><span className="field-hint">Auto dose {fmt(citricDoseGPerL,3)} g/L → ₦{fmt(citricCostPerL,3)}/L</span></div>}
            {useCitric && <div className="field"><label>Citric bulk (₦/kg)</label><input type="number" value={citricPricePerKg} onChange={e=>setCitricPricePerKg(e.target.value)}/></div>}
          </div>

          <div className="form-grid cols-2" style={{marginTop:10}}>
            <div className="field"><label>Vitamin A target (IU/g)</label><input type="number" step="0.5" value={vitTargetIU} onChange={e=>setVitTargetIU(e.target.value)}/></div>
            <div className="field"><label>Vit A concentrate (IU/g)</label><input type="number" value={vitStockIU} onChange={e=>setVitStockIU(e.target.value)}/></div>
            <div className="field"><label>Vit A bulk price (₦/kg)</label><input type="number" value={vitPricePerKg} onChange={e=>setVitPricePerKg(e.target.value)}/></div>
            <div className="field"><label>&nbsp;</label>
              <div className="inline-info" style={{padding:'6px 0'}}><span className="ii-label">Vit A {fmt(vitDoseGPerL,4)} g/L</span><span className="ii-value">₦{fmt(vitCostPerL,3)}</span></div>
            </div>
          </div>
          <div className="inline-info" style={{borderTop:'1px solid var(--accent)',paddingTop:8,marginTop:6}}>
            <span className="ii-label">Total chemicals / litre</span><span className="ii-value" style={{color:'var(--accent)'}}>₦{fmt(chemPerL,3)}</span>
          </div>
        </div>

        <div className="card">
          <div className="section-title">Fixed Monthly Labour &amp; Operations</div>
          <div className="form-grid cols-2">
            {Object.keys(ovhLabels).map(k=><OvField key={k} k={k}/>)}
          </div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:12,marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>Additional Workers &amp; Expenses</div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {customOvh.map(c=>(
              <div key={c.id} style={{display:'flex',gap:6,alignItems:'center'}}>
                <input style={{flex:2,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:6,fontSize:13,outline:'none'}} placeholder="Name (e.g. Extra Worker, Rent, Water, Insurance)" value={c.label} onChange={e=>updateCustomOvh(c.id,{label:e.target.value})}/>
                <input type="number" style={{flex:1,minWidth:90,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:6,fontSize:13,outline:'none'}} placeholder="₦/mo" value={c.amount} onChange={e=>updateCustomOvh(c.id,{amount:e.target.value})}/>
                <button className="btn btn-danger btn-xs" onClick={()=>removeCustomOvh(c.id)} title="Remove line">✕</button>
              </div>
            ))}
            {customOvh.length===0 && <div style={{fontSize:11,color:'var(--text4)'}}>No extra lines yet — add workers (e.g. more cleaners, loaders) or expenses (rent, water, internet…).</div>}
          </div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={addCustomOvh}>+ Add Worker / Expense</button>
          {customMonthly>0 && <div className="inline-info" style={{marginTop:6}}><span className="ii-label">Additional workers &amp; expenses / month</span><span className="ii-value">{fmtCur(customMonthly)}</span></div>}

          <div className="section-title" style={{marginTop:16}}>Power — Diesel Generator</div>
          <div className="form-grid cols-2">
            <div className="field"><label>Diesel Spend (₦)</label><input type="number" value={dieselSpend} onChange={e=>setDieselSpend(e.target.value)}/></div>
            <div className="field"><label>…every (days)</label><input type="number" step="0.5" value={dieselDays} onChange={e=>setDieselDays(e.target.value)}/><span className="field-hint">e.g. ₦300,000 every 3 days</span></div>
          </div>
          <div className="inline-info" style={{marginTop:6}}>
            <span className="ii-label">Diesel / day</span><span className="ii-value">{fmtCur(dieselPerDay)}</span>
          </div>
          <div className="inline-info">
            <span className="ii-label">Diesel / month (≈{DAYS_PER_MONTH} days)</span><span className="ii-value">{fmtCur(dieselMonthly)}</span>
          </div>

          <div className="inline-info" style={{marginTop:8,borderTop:'1px solid var(--accent)',paddingTop:8}}>
            <span className="ii-label">Total Fixed Cost / month</span>
            <span className="ii-value" style={{color:'var(--accent)'}}>{fmtCur(fixedMonthly)}</span>
          </div>
          <div className="inline-info"><span className="ii-label">Labour / litre (absorbed)</span><span className="ii-value">₦{fmt(labourPerL,2)}</span></div>
          <div className="inline-info"><span className="ii-label">Power (diesel) / litre</span><span className="ii-value">₦{fmt(dieselPerL,2)}</span></div>
          <div className="inline-info"><span className="ii-label">Total overhead / litre</span><span className="ii-value">₦{fmt(overheadPerL,2)}</span></div>
        </div>
      </div>

      <div className="card">
        <div className="section-title">Pricing Parameters</div>
        <div className="form-grid cols-4">
          <div className="field"><label>Target Profit (%)</label><input type="number" value={profitPct} onChange={e=>setProfitPct(e.target.value)}/><span className="field-hint">Applied over unit cost · edible-oil manufacturers typically run ~10–20% net</span></div>
          <div className="field"><label>Distributor Margin (%)</label><input type="number" value={distMargin} onChange={e=>setDistMargin(e.target.value)}/><span className="field-hint">International average ≈ 5–10% (bulk distributors)</span></div>
          <div className="field"><label>Wholesaler Margin (%)</label><input type="number" value={wholeMargin} onChange={e=>setWholeMargin(e.target.value)}/><span className="field-hint">International average ≈ 8–15%</span></div>
          <div className="field"><label>Retailer Margin (%)</label><input type="number" value={retailMargin} onChange={e=>setRetailMargin(e.target.value)}/><span className="field-hint">International average ≈ 15–30% for FMCG food</span></div>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginTop:8}}>Margins are cumulative down the chain (each tier adds its % over what it paid). The ranges above are typical international/FMCG benchmarks — adjust to your market.</div>
      </div>

      <div className="metrics-row cols-4 mb-16">
        <div className="metric-card"><div className="metric-label">Production Cost / L</div><div className="metric-value" style={{fontSize:20}}>₦{fmt(costPerL,2)}</div><div className="metric-sub">{oilType} oil</div></div>
        <div className="metric-card accent"><div className="metric-label">Ex-Factory / L</div><div className="metric-value" style={{fontSize:20}}>₦{fmt(exFactoryPerL,2)}</div><div className="metric-sub">incl. {profitPct}% profit</div></div>
        <div className="metric-card green"><div className="metric-label">Profit / L</div><div className="metric-value" style={{fontSize:20}}>₦{fmt(profitPerL,2)}</div><div className="metric-sub">{costPerL>0?fmt((profitPerL/costPerL)*100,1):'0'}% markup</div></div>
        <div className="metric-card blue"><div className="metric-label">Recommended Consumer / L</div><div className="metric-value" style={{fontSize:20}}>₦{fmt(consumerPerL,2)}</div><div className="metric-sub">{vsAvg>=0?'+':''}{vsAvg.toFixed(1)}% vs market</div></div>
      </div>

      <div className="card">
        <div className="flex-between mb-8">
          <div className="section-title" style={{margin:0}}>Expected Profit — by Total Refined Output</div>
        </div>
        <div className="form-grid cols-2 mb-12" style={{maxWidth:520}}>
          <div className="field"><label>Total Finished Output (L)</label><input type="number" value={outputVol} onChange={e=>setOutputVol(e.target.value)} placeholder={`default: ${fmtN(monthlyVol)} (monthly)`}/><span className="field-hint">Number/volume of final refined product for this run</span></div>
          <div className="field"><label>&nbsp;</label>
            <div className="inline-info" style={{padding:'6px 0'}}><span className="ii-label">Basis volume</span><span className="ii-value">{fmtN(outVol)} L</span></div>
          </div>
        </div>
        <div className="metrics-row cols-4" style={{marginBottom:12}}>
          <div className="metric-card"><div className="metric-label">Total Production Cost</div><div className="metric-value" style={{fontSize:18}}>{fmtCur(totalCost)}</div></div>
          <div className="metric-card accent"><div className="metric-label">Ex-Factory Revenue</div><div className="metric-value" style={{fontSize:18}}>{fmtCur(totalExFactory)}</div><div className="metric-sub">sold to distributors</div></div>
          <div className="metric-card green"><div className="metric-label">Expected Profit</div><div className="metric-value" style={{fontSize:18}}>{fmtCur(totalProfit)}</div><div className="metric-sub">at ex-factory</div></div>
          <div className="metric-card blue"><div className="metric-label">Profit if sold at RRP</div><div className="metric-value" style={{fontSize:18}}>{fmtCur(rrpProfit)}</div><div className="metric-sub">consumer price</div></div>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Pack Size</th><th style={{textAlign:'right'}}>Units from Output</th><th style={{textAlign:'right'}}>Ex-Factory / Unit</th><th style={{textAlign:'right'}}>Profit / Unit</th><th style={{textAlign:'right'}}>Total Profit</th></tr></thead>
            <tbody>
              {PACK_SIZES.map(p=>{
                const units = p.litres>0 ? Math.floor(outVol/p.litres) : 0;
                const exUnit = exFactoryPerL*p.litres;
                const profUnit = profitPerL*p.litres;
                return (
                  <tr key={p.label}>
                    <td className="td-primary">{p.label}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{fmtN(units)}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{fmtCur(exUnit)}</td>
                    <td className="td-mono" style={{textAlign:'right',color:'var(--green)'}}>{fmtCur(profUnit)}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{fmtCur(profUnit*units)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginTop:8}}>Expected profit = (ex-factory price − unit cost) × output. "Units from Output" shows how many packs of each size the {fmtN(outVol)} L run yields.</div>
      </div>

      <div className="card">
        <div className="section-title">Recommended Prices — by Pack Size &amp; Channel</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Pack Size</th><th style={{textAlign:'right'}}>Production Cost</th>{channels.map(c=><th key={c.key} style={{textAlign:'right'}}>{c.key}</th>)}</tr></thead>
            <tbody>
              {PACK_SIZES.map(p=>(
                <tr key={p.label}>
                  <td className="td-primary">{p.label}</td>
                  <td className="td-mono" style={{textAlign:'right',color:'var(--text3)'}}>{fmtCur(costPerL*p.litres)}</td>
                  {channels.map(c=><td key={c.key} className="td-mono" style={{textAlign:'right',color:c.key.startsWith('Consumer')?'var(--accent)':'var(--text)'}}>{fmtCur(c.perL*p.litres)}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginTop:8}}>
          <strong>Production Cost</strong> = the pre-profit unit cost per pack (₦{fmt(costPerL,2)}/L). <strong>Distributor (Ex-Factory)</strong> = production cost + your {profitPct}% profit — this is our selling price to distributors, which is why it sits just above production cost (not the same as it). Each later tier adds its margin: +{distMargin}% → Wholesaler, +{wholeMargin}% → Retailer, +{retailMargin}% → Consumer (RRP).
        </div>
      </div>

      <div className="card">
        <div className="flex-between mb-8">
          <div className="section-title" style={{margin:0}}>Competitor Comparison</div>
          <span className="badge badge-info">⟳ Auto-updates every Tuesday</span>
        </div>
        <div style={{fontSize:12,color:'var(--text3)',marginBottom:10}}>
          Last updated: <strong style={{color:'var(--text2)'}}>{longDate(competitors.tuesday)}</strong> · Next update: <strong style={{color:'var(--text2)'}}>{longDate(nextTuesday())}</strong>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>Consumer (retail) price for each pack size. Competitor pack prices are derived from each brand's per-litre price.</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Brand</th>{PACK_SIZES.map(p=><th key={p.label} style={{textAlign:'right'}}>{p.label}</th>)}</tr></thead>
            <tbody>
              {competitors.prices.map(c=>(
                <tr key={c.name}>
                  <td className="td-primary">{c.name}<div style={{fontSize:10,color:'var(--text4)'}}>{c.grade}</div></td>
                  {PACK_SIZES.map(p=><td key={p.label} className="td-mono" style={{textAlign:'right'}}>{fmtCur(c.price*p.litres)}</td>)}
                </tr>
              ))}
              <tr style={{borderTop:'2px solid var(--accent)'}}>
                <td className="td-primary" style={{color:'var(--accent)'}}>Ugomba Noel Ltd (our RRP)<div style={{fontSize:10,color:'var(--text4)'}}>{oilType} oil</div></td>
                {PACK_SIZES.map(p=><td key={p.label} className="td-mono" style={{textAlign:'right',color:'var(--accent)'}}>{fmtCur(consumerPerL*p.litres)}</td>)}
              </tr>
            </tbody>
          </table>
        </div>
        <div style={{fontSize:11,color:'var(--text3)',marginTop:8}}>
          Market average: <strong style={{color:'var(--text2)'}}>{fmtCur(compAvg)}</strong>/L. Our recommended RRP is {vsAvg>=0?'above':'below'} market by {Math.abs(vsAvg).toFixed(1)}%. Competitor figures are indicative and refreshed automatically each Tuesday.
          {vsAvg>25 && <span style={{color:'var(--accent)'}}> ⚠ Your required price is well above market — review raw-material sourcing, overheads or the profit/margin assumptions to stay competitive.</span>}
          {vsAvg<-15 && <span style={{color:'var(--green)'}}> ✓ You have room to raise price or offer trade discounts while remaining competitive.</span>}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   COST DASHBOARD
══════════════════════════════════════════════════════════ */
function CostDashboard({ inflationRate, marginAbove, batches, user }) {
  const [oilVol, setOilVol]     = useState('10000');
  const [oilCost, setOilCost]   = useState('650');
  const [naohCost, setNaohCost] = useState('1200');
  const [acidType, setAcidType] = useState('Phosphoric'); // Phosphoric | Citric | Both
  const [acidCost, setAcidCost] = useState('3500');       // phosphoric ₦/L
  const [citricCost, setCitricCost] = useState('2200');   // citric ₦/kg
  const [vitACost, setVitACost] = useState('85000');
  const [laborCost, setLaborCost] = useState('80000');
  const [energyCost, setEnergyCost] = useState('45000');
  const [packCost, setPackCost] = useState('35000');

  const vol   = parseFloat(oilVol)||0;
  const raw   = vol * parseFloat(oilCost) / 1000;
