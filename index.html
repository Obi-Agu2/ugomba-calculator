  const acidTerm = acidType==='Phosphoric' ? parseFloat(acidCost)*0.025
                 : acidType==='Citric'     ? parseFloat(citricCost)*0.02
                 : parseFloat(acidCost)*0.025 + parseFloat(citricCost)*0.02;
  const chem  = (vol/1000) * (parseFloat(naohCost)*7.5 + acidTerm + parseFloat(vitACost)*0.0201);
  const labor = parseFloat(laborCost)||0;
  const energy= parseFloat(energyCost)||0;
  const pack  = parseFloat(packCost)||0;
  const total = raw + chem + labor + energy + pack;
  const exFac = vol > 0 ? total / vol : 0;
  const effMgn = (inflationRate + marginAbove) / 100;
  const wholesale = exFac * (1 + effMgn);
  const retail    = wholesale * 1.15;
  const profit_per_l = wholesale - exFac;
  const total_profit = profit_per_l * vol;

  const items = [
    ['Raw Material (Oil)', raw],
    ['Chemicals', chem],
    ['Labour', labor],
    ['Energy / Utilities', energy],
    ['Packaging', pack],
  ];
  const maxCost = Math.max(...items.map(i=>i[1]), 1);

  const reportMeta = {
    title:'Production Cost Analysis Report',
    metaItems:[['Company',COMPANY],['Batch Volume',fmtN(vol)+' L'],['Margin Basis',`Inflation ${inflationRate}% + ${marginAbove}%`],...reportMetaBase(user)],
  };
  const reportSections = [
    { kpis:[
      { label:'Total Production Cost', value:fmtCur(total), sub:`${fmtN(vol)} L batch` },
      { label:'Ex-Factory Cost', value:'₦'+fmt(exFac,2), sub:'per litre' },
      { label:'Effective Margin', value:(inflationRate+marginAbove)+'%', sub:`Inflation ${inflationRate}% + Margin ${marginAbove}%` },
      { label:'Total Batch Profit', value:fmtCur(total_profit), sub:'₦'+fmt(profit_per_l,2)+' / L' },
    ]},
    { title:'Cost Breakdown (per batch)',
      head:['Cost Component',{label:'Amount (₦)',num:true},{label:'Share of Total',num:true}],
      rows:[...items.map(([l,v])=>[l,{num:true,text:fmtCur(v)},{num:true,text:(total?((v/total)*100).toFixed(1):'0.0')+'%'}]),
        ['Total Production Cost',{num:true,text:fmtCur(total)},{num:true,text:'100.0%'}]] },
    { title:'Pricing Chain (per litre)',
      head:['Tier',{label:'Price / Litre (₦)',num:true},'Basis'],
      rows:[['Ex-Factory',{num:true,text:fmt(exFac,2)},'Production cost per litre'],
        ['Wholesale',{num:true,text:fmt(wholesale,2)},`+${inflationRate+marginAbove}% margin over ex-factory`],
        ['Retail',{num:true,text:fmt(retail,2)},'+15% retail mark-up over wholesale']] },
    { note:'Wholesale price applies the CEO-set effective margin (inflation + margin) above the ex-factory cost. Retail adds a further 15% distribution mark-up. Figures are indicative and should be validated against current market conditions before quotation.' },
  ];

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading mb-4">Production Cost Analysis</div>
          <div className="page-sub">Ex-factory costing, wholesale &amp; retail pricing chain based on CEO-set inflation parameters</div>
        </div>
        <ReportActions meta={reportMeta} sections={reportSections} filename={`Cost-Analysis-Report-${todayStr()}.pdf`}/>
      </div>

      <div className="alert alert-info mb-16">
        <span className="alert-icon">ℹ</span>
        Current margin formula: Inflation {inflationRate}% + Margin {marginAbove}% = <strong>{inflationRate+marginAbove}%</strong> above ex-factory price. Adjust in Approval Queue → Inflation Settings (Director+).
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="section-title">Cost Inputs — per batch</div>
          <div className="form-grid cols-2">
            <div className="field"><label>Oil Volume (L)</label><input type="number" value={oilVol} onChange={e=>setOilVol(e.target.value)}/></div>
            <div className="field"><label>Oil Cost (₦/L)</label><input type="number" value={oilCost} onChange={e=>setOilCost(e.target.value)}/></div>
            <div className="field"><label>NaOH (₦/kg)</label><input type="number" value={naohCost} onChange={e=>setNaohCost(e.target.value)}/></div>
            <div className="field"><label>Degumming Acid</label>
              <select value={acidType} onChange={e=>setAcidType(e.target.value)}>
                <option>Phosphoric</option><option>Citric</option><option>Both</option>
              </select>
            </div>
            {(acidType==='Phosphoric'||acidType==='Both') && <div className="field"><label>Phosphoric Acid (₦/L)</label><input type="number" value={acidCost} onChange={e=>setAcidCost(e.target.value)}/></div>}
            {(acidType==='Citric'||acidType==='Both') && <div className="field"><label>Citric Acid (₦/kg)</label><input type="number" value={citricCost} onChange={e=>setCitricCost(e.target.value)}/></div>}
            <div className="field"><label>Vitamin A Conc. (₦/kg)</label><input type="number" value={vitACost} onChange={e=>setVitACost(e.target.value)}/></div>
            <div className="field"><label>Labour (₦ flat)</label><input type="number" value={laborCost} onChange={e=>setLaborCost(e.target.value)}/></div>
            <div className="field"><label>Energy (₦ flat)</label><input type="number" value={energyCost} onChange={e=>setEnergyCost(e.target.value)}/></div>
            <div className="field"><label>Packaging (₦ flat)</label><input type="number" value={packCost} onChange={e=>setPackCost(e.target.value)}/></div>
          </div>
        </div>

        <div className="card">
          <div className="section-title">Cost Breakdown</div>
          <div className="bar-chart mb-12">
            {items.map(([l,v])=>(
              <div key={l} className="bar-col">
                <div className="bar-value">{fmtCur(v)}</div>
                <div className="bar-fill" style={{height:`${(v/maxCost)*80}px`,background:'var(--accent)',opacity:.8}}/>
                <div className="bar-label">{l.split(' ')[0]}</div>
              </div>
            ))}
          </div>
          {items.map(([l,v])=>(
            <div key={l} className="inline-info">
              <span className="ii-label">{l}</span>
              <span className="ii-value">{fmtCur(v)}</span>
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',marginTop:10,padding:'10px 0',borderTop:'1px solid var(--accent)',color:'var(--accent)',fontWeight:500}}>
            <span>Total Production Cost</span>
            <span className="mono">{fmtCur(total)}</span>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="section-title">Pricing Chain — Inflation-Adjusted</div>
        <div className="price-chain">
          {[
            ['Ex-Factory', exFac, 'per litre', ''],
            ['→','','','arrow'],
            ['Wholesale', wholesale, `+${inflationRate+marginAbove}% margin`, ''],
            ['→','','','arrow'],
            ['Retail', retail, '+15% retail mark-up', ''],
          ].map((item,i)=>
            item[3]==='arrow'
              ? <div key={i} className="pc-arrow">→</div>
              : (
                <div key={i} className="pc-item" style={item[0]==='Wholesale'?{background:'rgba(245,166,35,.05)'}:{}}>
                  <div className="pc-item-label">{item[0]}</div>
                  <div className="pc-item-value">₦{fmt(Number(item[1]),2)}</div>
                  <div className="pc-item-sub">{item[2]}</div>
                </div>
              )
          )}
        </div>
        <div className="metrics-row cols-3" style={{marginBottom:0,marginTop:12}}>
          <div className="metric-card green">
            <div className="metric-label">Profit per Litre</div>
            <div className="metric-value" style={{fontSize:20}}>₦{fmt(profit_per_l,2)}</div>
          </div>
          <div className="metric-card green">
            <div className="metric-label">Total Batch Profit</div>
            <div className="metric-value" style={{fontSize:20}}>{fmtCur(total_profit)}</div>
            <div className="metric-sub">{fmtN(vol)}L batch</div>
          </div>
          <div className="metric-card accent">
            <div className="metric-label">Effective Margin</div>
            <div className="metric-value" style={{fontSize:20}}>{inflationRate+marginAbove}%</div>
            <div className="metric-sub">Inflation {inflationRate}% + Margin {marginAbove}%</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   APPROVAL QUEUE
══════════════════════════════════════════════════════════ */
function ApprovalQueue({ user, batches, setBatches, inventory, setInventory, addAudit, showToast, inflationRate, setInflationRate, marginAbove, setMarginAbove }) {
  const [rejectId, setRejectId]     = useState(null);
  const [rejectReason, setRejectReason] = useState('');
  const [showInflation, setShowInflation] = useState(false);
  const [tempInfl, setTempInfl]     = useState(inflationRate);
  const [tempMargin, setTempMargin] = useState(marginAbove);
  const [activeTab, setActiveTab]   = useState('pending');
  const [editBatch, setEditBatch]   = useState(null);

  const canApprove = user.role==='superadmin' || user.role==='admin' || canByPosition(user,'Manager');
  const canInflation = user.role==='superadmin' || user.role==='admin' || canByPosition(user,'Director');
  const isAdmin = user.role==='superadmin' || user.role==='admin';

  const pending  = batches.filter(b=>b.status==='pending' && !b.archived);
  const approved = batches.filter(b=>b.status==='approved' && !b.archived);
  const rejected = batches.filter(b=>b.status==='rejected' && !b.archived);
  const activeBatches = batches.filter(b=>!b.archived);
  const archivedBatches = batches.filter(b=>b.archived);

  const archiveBatch = (b) => {
    setBatches(prev => prev.map(x => x.id===b.id ? {...x, archived:!x.archived} : x));
    addAudit(`Batch ${b.id} ${b.archived?'restored from archive':'archived'} by ${user.name}`,'warning','approval');
    showToast(`Batch ${b.id} ${b.archived?'restored':'archived'}`);
  };
  const deleteBatch = (b) => {
    setBatches(prev => prev.filter(x => x.id!==b.id));
    addAudit(`Batch ${b.id} permanently deleted by ${user.name}`,'error','approval');
    showToast(`Batch ${b.id} deleted`,'error');
  };
  const saveBatchEdit = () => {
    if (!editBatch) return;
    const origId = editBatch._origId || editBatch.id;
    const clean = {...editBatch}; delete clean._origId;
    if (!clean.id || !String(clean.id).trim()) return showToast('Batch ID is required','error');
    clean.id = String(clean.id).trim();
    if (clean.id !== origId && batches.some(b => b.id === clean.id)) return showToast('That Batch ID already exists','error');
    const numFields = ['oil_volume','ffa','naoh_kg','acid_ml','vitA_g','target_conc'];
    numFields.forEach(f => { if (clean[f]!==undefined && clean[f]!=='' && clean[f]!==null) clean[f] = parseFloat(clean[f]); });
    setBatches(prev => prev.map(x => x.id===origId ? clean : x));
    addAudit(`Batch ${origId}${clean.id!==origId?` → ${clean.id}`:''} edited by ${user.name} — status: ${clean.status}`,'info','approval');
    showToast(`Batch ${clean.id} updated`); setEditBatch(null);
  };

  const deductInventory = (batch) => {
    const chemMap = { NaOH:'NaOH (Caustic Soda)', Phosphoric:'Phosphoric Acid (85%)', VitaminA:'Vitamin A Concentrate' };
    const chem = chemMap[batch.type];
    const qty = batch.type==='NaOH' ? batch.naoh_kg : batch.type==='Phosphoric' ? (batch.acid_ml||0)/1000 : (batch.vitA_g||0)/1000;
    setInventory(prev => prev.map(i => i.chemical===chem ? {...i, stock: Math.max(0, i.stock - qty)} : i));
  };

  const approveBatch = (batch) => {
    setBatches(prev => prev.map(b => b.id===batch.id ? {...b, status:'approved', approver:user.name, approved_at:todayStr()} : b));
    deductInventory(batch);
    addAudit(`Approved batch ${batch.id} — inventory deducted for ${batch.type}`,'success','approval');
    showToast(`Batch ${batch.id} approved`,'success');
  };

  const rejectBatch = (id) => {
    if (!rejectReason.trim()) return;
    setBatches(prev => prev.map(b => b.id===id ? {...b, status:'rejected', approver:user.name, rejection_reason:rejectReason} : b));
    addAudit(`Rejected batch ${id}: ${rejectReason}`,'warning','approval');
    showToast(`Batch ${id} rejected`,'error');
    setRejectId(null); setRejectReason('');
  };

  const saveInflation = () => {
    setInflationRate(parseFloat(tempInfl)||0);
    setMarginAbove(parseFloat(tempMargin)||0);
    addAudit(`Updated inflation settings — Rate: ${tempInfl}%, Margin above: ${tempMargin}%`,'info','system');
    setShowInflation(false);
    showToast('Inflation settings saved');
  };

  const BatchCard = ({ batch }) => (
    <div className="approval-card">
      <div className="approval-card-header">
        <div>
          <span className="approval-card-id">{batch.id}</span>
          <span className="approval-card-meta"> · {batch.type} · {batch.date} · Submitted by {batch.operator}</span>
        </div>
        <span className={`badge badge-${batch.status}`}>{batch.status.toUpperCase()}</span>
      </div>
      <div className="approval-card-params">
        <div className="acp-item"><span className="acp-label">Oil Volume: </span><span className="acp-value">{fmtN(batch.oil_volume)}L</span></div>
        {batch.naoh_kg && <div className="acp-item"><span className="acp-label">NaOH: </span><span className="acp-value">{batch.naoh_kg}kg</span></div>}
        {batch.ffa && <div className="acp-item"><span className="acp-label">FFA: </span><span className="acp-value">{batch.ffa}%</span></div>}
        {batch.acid_ml && <div className="acp-item"><span className="acp-label">H₃PO₄: </span><span className="acp-value">{batch.acid_ml}mL</span></div>}
        {batch.vitA_g && <div className="acp-item"><span className="acp-label">Vit A: </span><span className="acp-value">{batch.vitA_g}g</span></div>}
        {batch.target_conc && <div className="acp-item"><span className="acp-label">Target: </span><span className="acp-value">{batch.target_conc} IU/g</span></div>}
        {batch.rejection_reason && <div className="acp-item" style={{width:'100%'}}><span className="acp-label">Rejection reason: </span><span className="acp-value" style={{color:'var(--red)'}}>{batch.rejection_reason}</span></div>}
      </div>
      {canApprove && batch.status==='pending' && (
        <div className="approval-actions">
          <button className="btn btn-success btn-sm" onClick={()=>approveBatch(batch)}>✓ Approve</button>
          {rejectId===batch.id ? (
            <>
              <input className="reject-input" placeholder="Rejection reason (required)…" value={rejectReason} onChange={e=>setRejectReason(e.target.value)}/>
              <button className="btn btn-danger btn-sm" onClick={()=>rejectBatch(batch.id)} disabled={!rejectReason.trim()}>Confirm</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{setRejectId(null);setRejectReason('');}}>Cancel</button>
            </>
          ) : (
            <button className="btn btn-danger btn-sm" onClick={()=>setRejectId(batch.id)}>✕ Reject</button>
          )}
        </div>
      )}
      {!canApprove && batch.status==='pending' && <div style={{fontSize:12,color:'var(--text3)'}}>Manager position or above required to approve batches</div>}
      {isAdmin && (
        <div style={{display:'flex',gap:4,marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)',flexWrap:'wrap'}}>
          <span style={{fontSize:11,color:'var(--text4)',alignSelf:'center',marginRight:4}}>Admin:</span>
          <button className="btn btn-ghost btn-xs" onClick={()=>setEditBatch({...batch, _origId:batch.id})}>Edit</button>
          <button className="btn btn-ghost btn-xs" onClick={()=>archiveBatch(batch)}>Archive</button>
          <button className="btn btn-danger btn-xs" onClick={()=>{ if(window.confirm(`Permanently delete batch ${batch.id}? This cannot be undone.`)) deleteBatch(batch); }}>Delete</button>
        </div>
      )}
    </div>
  );

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading">Approval Queue</div>
          <div className="page-sub">{pending.length} batch{pending.length!==1?'es':''} awaiting approval</div>
        </div>
        {canInflation && (
          <button className="btn btn-ghost" onClick={()=>{setShowInflation(!showInflation);setTempInfl(inflationRate);setTempMargin(marginAbove);}}>
            ⚙ Inflation & Margin Settings
          </button>
        )}
      </div>

      {showInflation && (
        <div className="card accent-border mb-16">
          <div className="section-title">Inflation & Margin Settings (Director+ only)</div>
          <div className="form-row">
            <div className="field">
              <label>Inflation Rate (%)</label>
              <input type="number" step="0.5" value={tempInfl} onChange={e=>setTempInfl(e.target.value)}/>
            </div>
            <div className="field">
              <label>Margin Above Inflation (%)</label>
              <input type="number" step="0.5" value={tempMargin} onChange={e=>setTempMargin(e.target.value)}/>
            </div>
            <div className="field" style={{maxWidth:120}}>
              <label>&nbsp;</label>
              <button className="btn btn-success" onClick={saveInflation}>Save Settings</button>
            </div>
          </div>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>
            Effective total margin: <strong style={{color:'var(--accent)'}}>{(parseFloat(tempInfl)||0)+(parseFloat(tempMargin)||0)}%</strong> above ex-factory price
          </div>
        </div>
      )}

      <div className="tabs">
        <div className={`tab-item${activeTab==='pending'?' active':''}`} onClick={()=>setActiveTab('pending')}>Pending ({pending.length})</div>
        <div className={`tab-item${activeTab==='approved'?' active':''}`} onClick={()=>setActiveTab('approved')}>Approved ({approved.length})</div>
        <div className={`tab-item${activeTab==='rejected'?' active':''}`} onClick={()=>setActiveTab('rejected')}>Rejected ({rejected.length})</div>
        <div className={`tab-item${activeTab==='all'?' active':''}`} onClick={()=>setActiveTab('all')}>All ({activeBatches.length})</div>
        {(isAdmin || archivedBatches.length>0) && <div className={`tab-item${activeTab==='archived'?' active':''}`} onClick={()=>setActiveTab('archived')}>Archived ({archivedBatches.length})</div>}
      </div>

      {activeTab === 'pending' && (
        <>
          {pending.length===0 ? <div className="empty-state card">✓ No batches pending approval</div> : pending.map(b=><BatchCard key={b.id} batch={b}/>)}
        </>
      )}

      {(activeTab==='approved'||activeTab==='rejected'||activeTab==='all'||activeTab==='archived') && (
        <div className="card">
          <div className="table-wrap">
            <table>
              <thead><tr><th>Batch ID</th><th>Type</th><th>Date</th><th>Oil (L)</th><th>Operator</th><th>Status</th><th>Approver</th><th>Notes</th>{isAdmin&&<th>Admin</th>}</tr></thead>
              <tbody>
                {(activeTab==='all'?activeBatches:activeTab==='archived'?archivedBatches:activeTab==='approved'?approved:rejected).slice().reverse().map(b=>(
                  <tr key={b.id}>
                    <td className="td-mono">{b.id}</td>
                    <td className="td-primary">{b.type}</td>
                    <td className="td-muted">{b.date}</td>
                    <td className="td-mono">{fmtN(b.oil_volume)}</td>
                    <td>{b.operator}</td>
                    <td><span className={`badge ${b.archived?'badge-archived':'badge-'+b.status}`}>{b.archived?'ARCHIVED':b.status.toUpperCase()}</span></td>
                    <td className="td-muted">{b.approver||'—'}</td>
                    <td className="td-muted" style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{b.rejection_reason||'—'}</td>
                    {isAdmin&&(
                      <td>
                        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                          <button className="btn btn-ghost btn-xs" onClick={()=>setEditBatch({...b, _origId:b.id})}>Edit</button>
                          <button className="btn btn-ghost btn-xs" onClick={()=>archiveBatch(b)}>{b.archived?'Restore':'Archive'}</button>
                          <button className="btn btn-danger btn-xs" onClick={()=>{ if(window.confirm(`Permanently delete batch ${b.id}? This cannot be undone.`)) deleteBatch(b); }}>Del</button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
                {(activeTab==='all'?activeBatches:activeTab==='archived'?archivedBatches:activeTab==='approved'?approved:rejected).length===0 &&
                  <tr><td colSpan={isAdmin?9:8} className="empty-state">No batches in this view</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {editBatch && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setEditBatch(null)}>
          <div className="modal">
            <div className="modal-title">Edit Batch: {editBatch._origId || editBatch.id}</div>
            <div className="modal-sub">Admin override — correct the batch number, oil line, entered data or status.</div>
            <div className="form-grid cols-2">
              <div className="field"><label>Batch Number</label><input value={editBatch.id||''} onChange={e=>setEditBatch({...editBatch,id:e.target.value})}/><span className="field-hint">Format: [Line]-[YYMMDD]-[Seq]</span></div>
              <div className="field"><label>Oil Line</label>
                <select value={editBatch.oil_type||'Soybean Oil'} onChange={e=>setEditBatch({...editBatch,oil_type:e.target.value})}>
                  {Object.keys(OIL_FACTORS).map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="field"><label>Date</label><input value={editBatch.date||''} onChange={e=>setEditBatch({...editBatch,date:e.target.value})}/></div>
              <div className="field"><label>Operator</label><input value={editBatch.operator||''} onChange={e=>setEditBatch({...editBatch,operator:e.target.value})}/></div>
              <div className="field"><label>Oil Volume (L)</label><input type="number" value={editBatch.oil_volume||''} onChange={e=>setEditBatch({...editBatch,oil_volume:e.target.value})}/></div>
              <div className="field"><label>Status</label>
                <select value={editBatch.status} onChange={e=>setEditBatch({...editBatch,status:e.target.value})}>
                  {['pending','approved','rejected'].map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              {editBatch.type==='NaOH' && <><div className="field"><label>FFA (%)</label><input type="number" value={editBatch.ffa||''} onChange={e=>setEditBatch({...editBatch,ffa:e.target.value})}/></div>
                <div className="field"><label>NaOH (kg)</label><input type="number" value={editBatch.naoh_kg||''} onChange={e=>setEditBatch({...editBatch,naoh_kg:e.target.value})}/></div></>}
              {editBatch.type==='Phosphoric' && <div className="field"><label>H₃PO₄ (mL)</label><input type="number" value={editBatch.acid_ml||''} onChange={e=>setEditBatch({...editBatch,acid_ml:e.target.value})}/></div>}
              {editBatch.type==='VitaminA' && <><div className="field"><label>Target (IU/g)</label><input type="number" value={editBatch.target_conc||''} onChange={e=>setEditBatch({...editBatch,target_conc:e.target.value})}/></div>
                <div className="field"><label>Vit A (g)</label><input type="number" value={editBatch.vitA_g||''} onChange={e=>setEditBatch({...editBatch,vitA_g:e.target.value})}/></div></>}
              <div className="field" style={{gridColumn:'1 / -1'}}><label>Notes / Rejection Reason</label><input value={editBatch.rejection_reason||''} onChange={e=>setEditBatch({...editBatch,rejection_reason:e.target.value})}/></div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={()=>setEditBatch(null)}>Cancel</button>
              <button className="btn btn-success" onClick={saveBatchEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   INVENTORY MANAGEMENT
══════════════════════════════════════════════════════════ */
function InventoryPage({ inventory, setInventory, addAudit, showToast, user }) {
  const [editId, setEditId]   = useState(null);
  const [adjQty, setAdjQty]   = useState('');
  const [adjNote, setAdjNote] = useState('');
  const [showAdd, setShowAdd] = useState(false);
  const [newItem, setNewItem] = useState({ chemical:'', category:'Base Chemical', stock:'', unit:'kg', min_stock:'', cost_per_unit:'', supplier:'', expiry_date:'' });
  const [editItem, setEditItem] = useState(null);
  const [showArchived, setShowArchived] = useState(false);
  const isAdmin = user && (user.role==='superadmin' || user.role==='admin');

  const save = (id) => {
    const qty = parseFloat(adjQty);
    if (isNaN(qty)) return;
    setInventory(prev => prev.map(i => i.id===id ? {...i, stock:Math.max(0, i.stock+qty)} : i));
    addAudit(`Inventory adjusted for item "${inventory.find(i=>i.id===id)?.chemical}" ${qty>=0?'+':''}${qty} — ${adjNote||'Manual adjustment'}`,'info','inventory');
    showToast(`Inventory updated`);
    setEditId(null); setAdjQty(''); setAdjNote('');
  };

  const addItem = () => {
    if (!newItem.chemical||!newItem.stock) return;
    const item = { ...newItem, id:'i'+Date.now(), stock:parseFloat(newItem.stock), min_stock:parseFloat(newItem.min_stock)||10, cost_per_unit:parseFloat(newItem.cost_per_unit)||0 };
    setInventory(p=>[...p,item]);
    addAudit(`New chemical added to inventory: ${newItem.chemical} (${newItem.stock} ${newItem.unit})`,'success','inventory');
    showToast(`${newItem.chemical} added to inventory`);
    setNewItem({chemical:'',category:'Base Chemical',stock:'',unit:'kg',min_stock:'',cost_per_unit:'',supplier:'',expiry_date:''});
    setShowAdd(false);
  };

  const saveItemEdit = () => {
    if (!editItem || !editItem.chemical) return showToast('Chemical name required','error');
    const clean = { ...editItem, stock:parseFloat(editItem.stock)||0, min_stock:parseFloat(editItem.min_stock)||0, cost_per_unit:parseFloat(editItem.cost_per_unit)||0 };
    setInventory(prev => prev.map(i => i.id===clean.id ? clean : i));
    addAudit(`Inventory item "${clean.chemical}" edited by ${user.name}`,'info','inventory');
    showToast('Item updated'); setEditItem(null);
  };
  const archiveItem = (i) => {
    setInventory(prev => prev.map(x => x.id===i.id ? {...x, archived:!x.archived} : x));
    addAudit(`Inventory item "${i.chemical}" ${i.archived?'restored':'archived'} by ${user.name}`,'warning','inventory');
    showToast(`${i.chemical} ${i.archived?'restored':'archived'}`);
  };
  const deleteItem = (i) => {
    setInventory(prev => prev.filter(x => x.id!==i.id));
    addAudit(`Inventory item "${i.chemical}" permanently deleted by ${user.name}`,'error','inventory');
    showToast(`${i.chemical} deleted`,'error');
  };

  const live = inventory.filter(i=>!i.archived);
  const archived = inventory.filter(i=>i.archived);
  const rows = showArchived ? archived : live;
  const lowStock = live.filter(i=>i.stock<=i.min_stock);
  const expiitems = live.filter(i=>{ const k=expiryStatus(i.expiry_date).kind; return k==='bad'||k==='warn'; });
  const totalValue = live.reduce((s,i)=>s+(i.stock*i.cost_per_unit),0);

  const reportMeta = {
    title:'Chemical Inventory Report',
    status:{ text: (lowStock.length||expiitems.length)? `⚠ ${lowStock.length} LOW · ${expiitems.length} EXPIRY` : '✓ STOCK HEALTHY', color: (lowStock.length||expiitems.length)?'#9a6212':'#1a7f43' },
    statusPdf: (lowStock.length||expiitems.length)?[154,98,18]:[26,127,67],
    metaItems:[['Company',COMPANY],['Items',fmtN(live.length)],['Total Value',fmtCur(totalValue)],...reportMetaBase(user)],
  };
  const reportSections = [
    { kpis:[
      { label:'Chemicals Tracked', value:fmtN(live.length) },
      { label:'Low Stock Alerts', value:fmtN(lowStock.length), sub:'At or below minimum' },
      { label:'Expiry Alerts', value:fmtN(expiitems.length), sub:'Expired or ≤60 days' },
      { label:'Total Inventory Value', value:fmtCur(totalValue) },
    ]},
    { title:'Chemical Stock Register',
      head:['Chemical','Category','Supplier',{label:'Stock',num:true},'Unit',{label:'Min',num:true},{label:'Cost/Unit (₦)',num:true},{label:'Value (₦)',num:true},'Expiry','Status'],
      rows: live.map(i=>{
        const es = expiryStatus(i.expiry_date);
        return [i.chemical,i.category,i.supplier||'—',{num:true,text:fmt(i.stock,1)},i.unit,{num:true,text:i.min_stock},{num:true,text:fmtN(i.cost_per_unit)},{num:true,text:fmtN(i.stock*i.cost_per_unit)},
          i.expiry_date||'—',
          i.stock<=i.min_stock ? {status:'bad',text:'LOW STOCK'} : es.kind==='bad'?{status:'bad',text:'EXPIRED'} : es.kind==='warn'?{status:'warn',text:'EXPIRING'} : {status:'ok',text:'OK'}];
      }) },
    ...(lowStock.length?[{ note:`Reorder required: ${lowStock.map(i=>`${i.chemical} (${fmt(i.stock,1)} ${i.unit})`).join(' · ')}` }]:[]),
    ...(expiitems.length?[{ note:`Expiry attention: ${expiitems.map(i=>`${i.chemical} (${i.expiry_date})`).join(' · ')}` }]:[]),
  ];

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading">Chemical Inventory</div>
          <div className="page-sub">{live.length} chemicals tracked · {lowStock.length} low stock · {expiitems.length} expiry alert{expiitems.length!==1?'s':''}{archived.length>0?` · ${archived.length} archived`:''}</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <ReportActions meta={reportMeta} sections={reportSections} filename={`Inventory-Report-${todayStr()}.pdf`}/>
          <button className="btn btn-primary" onClick={()=>setShowAdd(!showAdd)}>+ Add Chemical</button>
        </div>
      </div>

      <div className="metrics-row cols-3 mb-16">
        <div className="metric-card"><div className="metric-label">Total Items</div><div className="metric-value">{live.length}</div></div>
        <div className="metric-card red"><div className="metric-label">Low Stock Alerts</div><div className="metric-value">{lowStock.length}</div></div>
        <div className="metric-card accent"><div className="metric-label">Total Inventory Value</div><div className="metric-value" style={{fontSize:18}}>₦{fmtN(totalValue)}</div></div>
      </div>

      {lowStock.length > 0 && (
        <div className="alert alert-danger mb-16">
          <span className="alert-icon">▼</span>
          <div><strong>Low Stock:</strong> {lowStock.map(i=>`${i.chemical} (${fmt(i.stock,1)} ${i.unit})`).join(' · ')}</div>
        </div>
      )}

      {expiitems.length > 0 && (
        <div className="alert alert-warn mb-16">
          <span className="alert-icon">⌛</span>
          <div><strong>Expiry Watch:</strong> {expiitems.map(i=>{const es=expiryStatus(i.expiry_date);return `${i.chemical} — ${es.kind==='bad'?`EXPIRED ${-es.days}d ago`:`${es.days}d left`} (${i.expiry_date})`;}).join(' · ')}</div>
        </div>
      )}

      {showAdd && (
        <div className="card accent-border mb-16">
          <div className="section-title">Add New Chemical</div>
          <div className="form-grid cols-3">
            <div className="field"><label>Chemical Name</label><input value={newItem.chemical} onChange={e=>setNewItem({...newItem,chemical:e.target.value})} placeholder="e.g. Citric Acid"/></div>
            <div className="field"><label>Category</label>
              <select value={newItem.category} onChange={e=>setNewItem({...newItem,category:e.target.value})}>
                {['Base Chemical','Acid','Fortifier','Adsorbent','Filtration','Antioxidant','Other'].map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="field"><label>Supplier</label><input value={newItem.supplier} onChange={e=>setNewItem({...newItem,supplier:e.target.value})} placeholder="Supplier name"/></div>
            <div className="field"><label>Initial Stock</label><input type="number" value={newItem.stock} onChange={e=>setNewItem({...newItem,stock:e.target.value})}/></div>
            <div className="field"><label>Unit</label>
              <select value={newItem.unit} onChange={e=>setNewItem({...newItem,unit:e.target.value})}>
                {['kg','L','g','mL','tonne','drum'].map(u=><option key={u}>{u}</option>)}
              </select>
            </div>
            <div className="field"><label>Min Stock Level</label><input type="number" value={newItem.min_stock} onChange={e=>setNewItem({...newItem,min_stock:e.target.value})}/></div>
            <div className="field"><label>Cost per Unit (₦)</label><input type="number" value={newItem.cost_per_unit} onChange={e=>setNewItem({...newItem,cost_per_unit:e.target.value})}/></div>
            <div className="field"><label>Expiry Date</label><input type="date" value={newItem.expiry_date} onChange={e=>setNewItem({...newItem,expiry_date:e.target.value})}/></div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button className="btn btn-success" onClick={addItem} disabled={!newItem.chemical||!newItem.stock}>Add to Inventory</button>
            <button className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancel</button>
          </div>
        </div>
      )}

      {editItem && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setEditItem(null)}>
          <div className="modal">
            <div className="modal-title">Edit Chemical: {editItem.chemical}</div>
            <div className="modal-sub">Admin override — correct any field on this inventory record.</div>
            <div className="form-grid cols-3">
              <div className="field"><label>Chemical Name</label><input value={editItem.chemical} onChange={e=>setEditItem({...editItem,chemical:e.target.value})}/></div>
              <div className="field"><label>Category</label>
                <select value={editItem.category} onChange={e=>setEditItem({...editItem,category:e.target.value})}>
                  {['Base Chemical','Acid','Fortifier','Adsorbent','Filtration','Antioxidant','Other'].map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="field"><label>Supplier</label><input value={editItem.supplier||''} onChange={e=>setEditItem({...editItem,supplier:e.target.value})}/></div>
              <div className="field"><label>Stock</label><input type="number" value={editItem.stock} onChange={e=>setEditItem({...editItem,stock:e.target.value})}/></div>
              <div className="field"><label>Unit</label>
                <select value={editItem.unit} onChange={e=>setEditItem({...editItem,unit:e.target.value})}>
                  {['kg','L','g','mL','tonne','drum'].map(u=><option key={u}>{u}</option>)}
                </select>
              </div>
              <div className="field"><label>Min Stock Level</label><input type="number" value={editItem.min_stock} onChange={e=>setEditItem({...editItem,min_stock:e.target.value})}/></div>
              <div className="field"><label>Cost per Unit (₦)</label><input type="number" value={editItem.cost_per_unit} onChange={e=>setEditItem({...editItem,cost_per_unit:e.target.value})}/></div>
              <div className="field"><label>Expiry Date</label><input type="date" value={editItem.expiry_date||''} onChange={e=>setEditItem({...editItem,expiry_date:e.target.value})}/></div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={()=>setEditItem(null)}>Cancel</button>
              <button className="btn btn-success" onClick={saveItemEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}

      {(archived.length>0 || showArchived) && (
        <div className="tabs">
          <div className={`tab-item${!showArchived?' active':''}`} onClick={()=>setShowArchived(false)}>Active ({live.length})</div>
          <div className={`tab-item${showArchived?' active':''}`} onClick={()=>setShowArchived(true)}>Archived ({archived.length})</div>
        </div>
      )}

      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Chemical</th><th>Category</th><th>Stock</th><th>Unit</th><th>Min Level</th><th>Cost/Unit</th><th>Total Value</th><th>Expiry</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
              {rows.length===0 && <tr><td colSpan={10} className="empty-state">{showArchived?'No archived items':'No chemicals in inventory'}</td></tr>}
              {rows.map(i => (
                <tr key={i.id}>
                  <td className="td-primary">{i.chemical}</td>
                  <td className="td-muted">{i.category}</td>
                  <td>
                    <div style={{marginBottom:4}}>
                      <span className="td-mono" style={{color:i.stock<=i.min_stock?'var(--red)':i.stock<=i.min_stock*2?'var(--accent)':'var(--text)'}}>{fmt(i.stock,1)}</span>
                    </div>
                    <div className="progress" style={{width:80}}>
                      <div className="progress-fill" style={{
                        width:`${Math.min(100,(i.stock/(i.min_stock*6))*100)}%`,
                        background:i.stock<=i.min_stock?'var(--red)':i.stock<=i.min_stock*2?'var(--accent)':'var(--green)'
                      }}/>
                    </div>
                  </td>
                  <td className="td-muted">{i.unit}</td>
                  <td className="td-mono">{i.min_stock}</td>
                  <td className="td-mono">{fmtCur(i.cost_per_unit)}</td>
                  <td className="td-mono">{fmtCur(i.stock * i.cost_per_unit)}</td>
                  <td>
                    {(() => { const es=expiryStatus(i.expiry_date);
                      const col = es.kind==='bad'?'var(--red)':es.kind==='warn'?'var(--accent)':es.kind==='ok'?'var(--text2)':'var(--text4)';
                      return <span className="td-mono" style={{color:col,fontSize:12}} title={es.kind==='bad'?`Expired ${-es.days} days ago`:es.kind==='warn'?`${es.days} days left`:''}>{i.expiry_date||'—'}{es.kind==='bad'&&' ⚠'}{es.kind==='warn'&&' ⌛'}</span>;
                    })()}
                  </td>
                  <td><span className={`badge ${i.stock<=i.min_stock?'badge-low':'badge-ok'}`}>{i.stock<=i.min_stock?'LOW STOCK':'OK'}</span></td>
                  <td>
                    {editId===i.id ? (
                      <div style={{display:'flex',gap:4,alignItems:'center',minWidth:220}}>
                        <input type="number" style={{width:70,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 6px',borderRadius:4,fontSize:12,outline:'none'}} placeholder="+/-" value={adjQty} onChange={e=>setAdjQty(e.target.value)}/>
                        <input style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 6px',borderRadius:4,fontSize:11,outline:'none'}} placeholder="Note…" value={adjNote} onChange={e=>setAdjNote(e.target.value)}/>
                        <button className="btn btn-success btn-xs" onClick={()=>save(i.id)}>✓</button>
                        <button className="btn btn-ghost btn-xs" onClick={()=>setEditId(null)}>✗</button>
                      </div>
                    ) : (
                      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                        {!i.archived && <button className="btn btn-ghost btn-xs" onClick={()=>{setEditId(i.id);setAdjQty('');setAdjNote('');}}>Adjust</button>}
                        {isAdmin && !i.archived && <button className="btn btn-ghost btn-xs" onClick={()=>setEditItem({...i})}>Edit</button>}
                        {isAdmin && <button className="btn btn-ghost btn-xs" onClick={()=>archiveItem(i)}>{i.archived?'Restore':'Archive'}</button>}
                        {isAdmin && <button className="btn btn-danger btn-xs" onClick={()=>{ if(window.confirm(`Permanently delete "${i.chemical}"? This cannot be undone.`)) deleteItem(i); }}>Del</button>}
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   ANALYTICS
══════════════════════════════════════════════════════════ */
function AnalyticsDashboard({ batches: allBatches, inventory: allInv, inflationRate, marginAbove, user }) {
  const batches = allBatches.filter(b=>!b.archived);
  const inventory = allInv.filter(i=>!i.archived);
  const approved = batches.filter(b=>b.status==='approved');
  const byType   = t => batches.filter(b=>b.type===t);
  const approvedByType = t => batches.filter(b=>b.type===t&&b.status==='approved');

  const approvalRate = batches.length ? Math.round((approved.length/batches.length)*100) : 0;
  const totalOil = approved.reduce((s,b)=>s+(b.oil_volume||0),0);
  const avgOilPerBatch = approved.length ? totalOil/approved.length : 0;

  const types = [
    { label:'NaOH Neutralisation', type:'NaOH', color:'var(--blue)' },
    { label:'Phosphoric Degumming', type:'Phosphoric', color:'var(--green)' },
    { label:'Vitamin A Fortification', type:'VitaminA', color:'var(--accent)' },
  ];

  const inventoryHealth = inventory.filter(i=>i.stock>i.min_stock*2).length;
  const healthScore = Math.round(
    (approvalRate * 0.3) +
    ((inventory.length ? inventoryHealth/inventory.length : 0)*100 * 0.3) +
    ((batches.length>0?70:0) * 0.4)
  );

  const reportMeta = {
    title:'Operational Analytics Report',
    metaItems:[['Company',COMPANY],['Batches Analysed',fmtN(batches.length)],['Health Score',healthScore+'/100'],...reportMetaBase(user)],
  };
  const reportSections = [
    { kpis:[
      { label:'Total Oil Processed', value:fmtN(totalOil)+' L', sub:'Approved batches' },
      { label:'Batch Approval Rate', value:approvalRate+'%', sub:`${approved.length} of ${batches.length}` },
      { label:'Avg Oil / Batch', value:fmtN(Math.round(avgOilPerBatch))+' L', sub:'Per approved batch' },
      { label:'Ops Health Score', value:healthScore+' / 100', sub:'Composite' },
    ]},
    { title:'Batch Type Distribution',
      head:['Process Type',{label:'Total Batches',num:true},{label:'Approved',num:true},{label:'Share',num:true}],
      rows: types.map(t=>[t.label,{num:true,text:byType(t.type).length},{num:true,text:approvedByType(t.type).length},{num:true,text:(batches.length?Math.round((byType(t.type).length/batches.length)*100):0)+'%'}]) },
    { title:'Detailed KPI Table',
      head:['Metric','Value','Benchmark','Status'],
      rows:[
        ['Total Batches Submitted', batches.length, '≥10 per period', batches.length>=10?{status:'ok',text:'OK'}:{status:'warn',text:'WATCH'}],
        ['Approved Batches', approved.length, '≥7 per period', approved.length>=7?{status:'ok',text:'OK'}:{status:'warn',text:'WATCH'}],
        ['Approval Rate', approvalRate+'%', '≥80%', approvalRate>=80?{status:'ok',text:'OK'}:{status:'bad',text:'BELOW'}],
        ['Vitamin A Compliance', approvedByType('VitaminA').length+'/'+byType('VitaminA').length, '100%', byType('VitaminA').length>0&&approvedByType('VitaminA').length===byType('VitaminA').length?{status:'ok',text:'OK'}:{status:'warn',text:'WATCH'}],
        ['Total Oil Processed', fmtN(totalOil)+' L', '—', {status:'info',text:'INFO'}],
        ['Low Stock Items', inventory.filter(i=>i.stock<=i.min_stock).length, '0', inventory.filter(i=>i.stock<=i.min_stock).length===0?{status:'ok',text:'OK'}:{status:'bad',text:'ACTION'}],
        ['Effective Margin', (inflationRate+marginAbove)+'%', `>${inflationRate}%`, marginAbove>0?{status:'ok',text:'OK'}:{status:'warn',text:'WATCH'}],
      ] },
    { note:'Health score is a composite of approval rate (30%), inventory health (30%) and production activity (40%). Benchmarks are internal operational targets.' },
  ];

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading mb-4">Analytics Dashboard</div>
          <div className="page-sub">Operational KPIs and production intelligence</div>
        </div>
        <ReportActions meta={reportMeta} sections={reportSections} filename={`Analytics-Report-${todayStr()}.pdf`}/>
      </div>

      <div className="metrics-row">
        <div className="metric-card accent">
          <div className="metric-label">Total Oil Processed</div>
          <div className="metric-value">{fmtN(totalOil)}</div>
          <div className="metric-sub">Litres — approved batches</div>
        </div>
        <div className="metric-card green">
          <div className="metric-label">Batch Approval Rate</div>
          <div className="metric-value">{approvalRate}%</div>
          <div className="metric-sub">{approved.length} of {batches.length} batches</div>
        </div>
        <div className="metric-card blue">
          <div className="metric-label">Avg Oil / Batch</div>
          <div className="metric-value">{fmtN(Math.round(avgOilPerBatch))}</div>
          <div className="metric-sub">Litres per approved batch</div>
        </div>
        <div className="metric-card" style={{borderLeft:'3px solid var(--cyan)'}}>
          <div className="metric-label">Ops Health Score</div>
          <div className="metric-value" style={{color:'var(--cyan)'}}>{healthScore}</div>
          <div className="metric-sub">/ 100 composite score</div>
        </div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="section-title">Batch Type Distribution</div>
          {types.map(t => {
            const total = byType(t.type).length;
            const appr  = approvedByType(t.type).length;
            return (
              <div key={t.type} style={{marginBottom:16}}>
                <div className="flex-between mb-4">
                  <span style={{fontSize:13,color:'var(--text2)'}}>{t.label}</span>
                  <span style={{fontSize:12,color:'var(--text3)',fontFamily:'var(--mono)'}}>{appr}/{total} approved</span>
                </div>
                <div className="progress">
                  <div className="progress-fill" style={{width:`${batches.length?Math.round((total/batches.length)*100):0}%`,background:t.color}}/>
                </div>
                <div style={{fontSize:11,color:'var(--text3)',marginTop:3}}>{batches.length?Math.round((total/batches.length)*100):0}% of all batches</div>
              </div>
            );
          })}
        </div>

        <div className="card">
          <div className="section-title">Batch Status Breakdown</div>
          {[
            ['Approved', approved.length, 'var(--green)'],
            ['Pending', batches.filter(b=>b.status==='pending').length, 'var(--accent)'],
            ['Rejected', batches.filter(b=>b.status==='rejected').length, 'var(--red)'],
          ].map(([l,v,c]) => (
            <div key={l} style={{marginBottom:14}}>
              <div className="flex-between mb-4">
                <span style={{fontSize:13,color:'var(--text2)'}}>{l}</span>
                <span style={{fontSize:14,fontFamily:'var(--mono)',fontWeight:500,color:c}}>{v}</span>
              </div>
              <div className="progress">
                <div className="progress-fill" style={{width:`${batches.length?Math.round((v/batches.length)*100):0}%`,background:c}}/>
              </div>
            </div>
          ))}

          <div className="separator"/>
          <div className="section-title">Inventory Health</div>
          {inventory.map(i => {
            const pct = Math.min(100,(i.stock/(i.min_stock*6))*100);
            return (
              <div key={i.id} style={{marginBottom:10}}>
                <div className="flex-between mb-4">
                  <span style={{fontSize:12,color:'var(--text2)'}}>{i.chemical}</span>
                  <span style={{fontSize:11,fontFamily:'var(--mono)',color:i.stock<=i.min_stock?'var(--red)':'var(--text3)'}}>{fmt(i.stock,1)} {i.unit}</span>
                </div>
                <div className="progress">
                  <div className="progress-fill" style={{width:`${pct}%`,background:i.stock<=i.min_stock?'var(--red)':i.stock<=i.min_stock*2?'var(--accent)':'var(--green)'}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="section-title">Detailed KPI Table</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Metric</th><th>Value</th><th>Benchmark</th><th>Status</th></tr></thead>
            <tbody>
              {[
                ['Total Batches Submitted', batches.length, '≥10 per period', batches.length>=10?'badge-ok':'badge-pending'],
                ['Approved Batches', approved.length, '≥7 per period', approved.length>=7?'badge-ok':'badge-pending'],
                ['Approval Rate', approvalRate+'%', '≥80%', approvalRate>=80?'badge-ok':'badge-rejected'],
                ['Vitamin A Compliance', approvedByType('VitaminA').length+'/'+byType('VitaminA').length, '100%', byType('VitaminA').length>0&&approvedByType('VitaminA').length===byType('VitaminA').length?'badge-ok':'badge-pending'],
                ['Total Oil Processed', fmtN(totalOil)+'L', '—', 'badge-info'],
                ['Low Stock Items', inventory.filter(i=>i.stock<=i.min_stock).length, '0', inventory.filter(i=>i.stock<=i.min_stock).length===0?'badge-ok':'badge-rejected'],
                ['Effective Margin', (inflationRate+marginAbove)+'%', `>${inflationRate}%`, marginAbove>0?'badge-ok':'badge-pending'],
              ].map(([m,v,b,s])=>(
                <tr key={m}>
                  <td className="td-primary">{m}</td>
                  <td className="td-mono">{v}</td>
                  <td className="td-muted">{b}</td>
                  <td><span className={`badge ${s}`}>{s.replace('badge-','').toUpperCase()}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   NAFDAC REPORT
══════════════════════════════════════════════════════════ */
const packCode = (label) => String(label).replace(/\s+/g,'');
function NAFDACReport({ batches, user }) {
  const live = batches.filter(b=>!b.archived);
  const approved = live.filter(b=>b.status==='approved');
  const vitApproved = live.filter(b=>b.type==='VitaminA'&&b.status==='approved');
  const vitAll = live.filter(b=>b.type==='VitaminA');
  const allCompliant = vitAll.every(b => b.status==='approved'||(b.target_conc&&b.target_conc>=11));
  const reportDate = todayStr();
  const isAdmin = user.role==='superadmin' || user.role==='admin';

  // Product-specific NAFDAC registration numbers: keyed by (oil line × pack size), editable & persisted.
  const [regNumbers, setRegNumbers] = useState(() => LS.get('regnums', {}));
  useEffect(() => { LS.set('regnums', regNumbers); }, [regNumbers]);
  const defaultReg = (line, pack) => `NFD/${lineCode(line)}/${packCode(pack)}`;
  const regKey = (line, pack) => `${line}||${pack}`;
  const getReg = (line, pack) => { const k = regKey(line,pack); return (k in regNumbers) ? regNumbers[k] : defaultReg(line,pack); };
  const setReg = (line, pack, val) => setRegNumbers(prev => ({ ...prev, [regKey(line,pack)]: val }));
  const regLines = Array.from(new Set(['Soybean Oil','Groundnut Oil', ...live.map(b=>b.oil_type).filter(Boolean)]));

  // Per-batch compliance certificate (batch number, registration numbers, amounts used, FFA/Vit A, etc.)
  const batchReport = (b) => {
    const line = b.oil_type || 'Soybean Oil';
    const isVit = b.type==='VitaminA';
    const cleared = b.status==='approved' && (!isVit || (b.target_conc||0)>=11);
    const statusText = b.status==='approved' ? (isVit && !((b.target_conc||0)>=11) ? '⚠ REVIEW REQUIRED' : '✓ CLEARED')
                     : b.status==='pending' ? '⧗ PENDING' : '✗ REJECTED';
    const statusColor = cleared ? '#1a7f43' : b.status==='pending' ? '#9a6212' : '#b23025';
    const statusKind  = cleared ? 'ok' : b.status==='pending' ? 'warn' : 'bad';

    const materials = [['Oil Volume treated', fmtN(b.oil_volume)+' L']];
    if (b.ffa!=null)        materials.push(['Free Fatty Acid (FFA) measured', b.ffa+' %']);
    if (b.type==='NaOH'      && b.naoh_kg!=null) materials.push(['NaOH used (neutralisation)', b.naoh_kg+' kg']);
    if (b.type==='Phosphoric'&& b.acid_ml!=null) materials.push(['H₃PO₄ used (degumming)', b.acid_ml+' mL']);
    if (isVit) {
      if (b.vitA_g!=null)     materials.push(['Vitamin A concentrate added', b.vitA_g+' g']);
      if (b.target_conc!=null)materials.push(['Vitamin A concentration achieved', b.target_conc+' IU/g']);
      materials.push(['NAFDAC minimum required', '11 IU/g']);
      materials.push(['Vitamin A compliance', (b.target_conc||0)>=11 ? 'MEETS minimum' : 'BELOW minimum']);
    }

    const meta = {
      title:'Batch Compliance Certificate',
      status:{ text:statusText, color:statusColor },
      statusPdf: cleared?[26,127,67]:b.status==='pending'?[154,98,18]:[178,48,37],
      metaItems:[['Company',COMPANY],['Batch No.',b.id],['Product Line',line],['Process',b.type],...reportMetaBase(user)],
    };
    const sections = [
      { kpis:[
        { label:'Batch Number', value:b.id },
        { label:'Oil Volume', value:fmtN(b.oil_volume)+' L', sub:line },
        { label:'Process', value:b.type },
        { label:'Status', value:b.status.toUpperCase() },
      ]},
      { title:'Batch Details',
        head:['Field','Value'],
        rows:[
          ['Batch Number', b.id],
          ['Process Type', b.type],
          ['Oil Line / Product', line],
          ['Production Date', b.date],
          ['Operator', b.operator||'—'],
          ['Approver', b.approver||'Pending'],
          ['Approved Date', b.approved_at||'—'],
          ['Batch Status', {status:statusKind, text:b.status.toUpperCase()}],
        ] },
      { title:'Materials & Measurements Used',
        head:['Parameter','Amount / Value'],
        rows: materials },
      { title:`Product NAFDAC Registration Numbers — ${line}`,
        head:['Pack Size','NAFDAC Registration No.'],
        rows: PACK_SIZES.map(p=>[p.label, getReg(line,p.label)]) },
      ...(b.rejection_reason ? [{ note:`QC / rejection note: ${b.rejection_reason}` }] : []),
      { note:`This certificate is generated by the ${COMPANY} Operations Platform for batch ${b.id}. NAFDAC registration numbers are product-specific (oil line × pack size). Vitamin A fortification complies with NAFDAC regulations for edible vegetable oil in Nigeria (minimum 11 IU/g Retinol equivalent). Valid for submission to the National Agency for Food and Drug Administration and Control (NAFDAC).` },
    ];
    return { meta, sections, filename:`Compliance-Certificate-${b.id}.pdf` };
  };

  // Aggregate summary report (all batches + full registration schedule)
  const reportMeta = {
    title:'NAFDAC Compliance Summary Report',
    status:{ text: allCompliant?'✓ COMPLIANT':'⚠ REVIEW REQUIRED', color: allCompliant?'#1a7f43':'#9a6212' },
    statusPdf: allCompliant?[26,127,67]:[154,98,18],
    metaItems:[['Company',COMPANY],['Standard','Edible Vegetable Oil Fortification'],['Period','2024'],...reportMetaBase(user)],
  };
  const reportSections = [
    { kpis:[
      { label:'Approved Production Batches', value:fmtN(approved.length), sub:'Cleared for distribution' },
      { label:'Vitamin A Batches', value:`${vitApproved.length}/${vitAll.length}`, sub:'Approved / Total' },
      { label:'NAFDAC Minimum', value:'11 IU/g', sub:'Vitamin A (Retinol eq.)' },
    ]},
    { title:'Product NAFDAC Registration Numbers (by oil line × pack size)',
      head:['Oil Line', ...PACK_SIZES.map(p=>p.label)],
      rows: regLines.map(line=>[line, ...PACK_SIZES.map(p=>getReg(line,p.label))]) },
    { title:'Vitamin A Fortification Records',
      head:['Batch ID','Date',{label:'Oil Vol (L)',num:true},{label:'Target (IU/g)',num:true},{label:'Vit A Added (g)',num:true},'Operator','Approver','NAFDAC Status'],
      rows: vitAll.map(b=>{
        const compliant = b.status==='approved' && (b.target_conc||0)>=11;
        const st = compliant ? {status:'ok',text:'COMPLIANT'} : b.status==='pending' ? {status:'warn',text:'PENDING'} : {status:'bad',text:'NON-COMPLIANT'};
        return [b.id, b.date, {num:true,text:fmtN(b.oil_volume)}, {num:true,text:b.target_conc||'—'}, {num:true,text:b.vitA_g||'—'}, b.operator, b.approver||'Pending', st];
      }) },
    { note:`This report is generated by the ${COMPANY} Operations Platform. NAFDAC registration numbers are product-specific (each oil line × pack size has its own number). Vitamin A fortification complies with NAFDAC regulations for edible vegetable oil fortification in Nigeria (minimum 11 IU/g Retinol equivalent).` },
  ];

  const inputStyle = {width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:6,fontSize:12,outline:'none',fontFamily:'var(--mono)'};

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading">NAFDAC Compliance</div>
          <div className="page-sub">Generated: {reportDate} · Per-batch certificates &amp; product-specific registration numbers</div>
        </div>
        <ReportActions meta={reportMeta} sections={reportSections} filename={`NAFDAC-Summary-${todayStr()}.pdf`}/>
      </div>

      <div className="nafdac-header">
        <div className="nafdac-seal">⬡</div>
        <div>
          <div className="nafdac-title">National Agency for Food &amp; Drug Administration and Control</div>
          <div className="nafdac-ref">Standard: Edible Vegetable Oil Fortification · Registrations are product-specific</div>
          <div style={{fontSize:12,color:'var(--text2)',marginTop:5}}>{COMPANY} · Production Operations</div>
        </div>
        <div style={{marginLeft:'auto',textAlign:'right'}}>
          <span className={`badge ${allCompliant?'badge-approved':'badge-pending'}`} style={{fontSize:12,padding:'4px 12px'}}>
            {allCompliant?'✓ COMPLIANT':'⚠ REVIEW REQUIRED'}
          </span>
        </div>
      </div>

      {/* PRODUCT-SPECIFIC REGISTRATION NUMBERS */}
      <div className="card">
        <div className="flex-between mb-8">
          <div className="section-title" style={{margin:0}}>Product NAFDAC Registration Numbers</div>
          {isAdmin
            ? <span style={{fontSize:11,color:'var(--text3)'}}>Editable · each oil line × pack size has its own number</span>
            : <span style={{fontSize:11,color:'var(--text3)'}}>View only — ask an admin to edit</span>}
        </div>
        {regLines.map(line=>(
          <div key={line} style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--text2)',marginBottom:6}}>{line} <span className="tag">{lineCode(line)}</span></div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
              {PACK_SIZES.map(p=>(
                <div key={p.label}>
                  <div style={{fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:3}}>{p.label}</div>
                  {isAdmin
                    ? <input style={inputStyle} value={getReg(line,p.label)} onChange={e=>setReg(line,p.label,e.target.value)}/>
                    : <div className="td-mono" style={{fontSize:12,color:'var(--text)'}}>{getReg(line,p.label)}</div>}
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      {/* PER-BATCH COMPLIANCE CERTIFICATES */}
      <div className="card">
        <div className="section-title">Per-Batch Compliance Certificates ({live.length})</div>
        <div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>Each certificate carries the batch number, product-specific registration numbers, the amounts of materials used, and the measured FFA / Vitamin A.</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Batch No.</th><th>Type</th><th>Oil Line</th><th>Date</th><th>Oil Vol (L)</th><th>Key Measurements</th><th>Status</th><th>Certificate</th></tr></thead>
            <tbody>
              {live.slice().reverse().map(b=>{
                const r = batchReport(b);
                const meas = [b.ffa!=null?`FFA ${b.ffa}%`:null, b.naoh_kg!=null?`NaOH ${b.naoh_kg}kg`:null, b.acid_ml!=null?`H₃PO₄ ${b.acid_ml}mL`:null, b.vitA_g!=null?`VitA ${b.vitA_g}g`:null, b.target_conc!=null?`${b.target_conc} IU/g`:null].filter(Boolean).join(' · ');
                return (
                  <tr key={b.id}>
                    <td className="td-mono">{b.id}</td>
                    <td className="td-primary">{b.type}</td>
                    <td>{b.oil_type||'—'}</td>
                    <td className="td-muted">{b.date}</td>
                    <td className="td-mono">{fmtN(b.oil_volume)}</td>
                    <td className="td-muted" style={{fontSize:11}}>{meas||'—'}</td>
                    <td><span className={`badge badge-${b.status}`}>{b.status.toUpperCase()}</span></td>
                    <td>
                      <div style={{display:'flex',gap:4}}>
                        <button className="btn btn-blue btn-xs" onClick={()=>downloadReportPdf(r.meta,r.sections,r.filename)}>⬇ PDF</button>
                        <button className="btn btn-ghost btn-xs" onClick={()=>openPrintableReport(r.meta,r.sections)}>⎙</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {live.length===0&&<tr><td colSpan={8} className="empty-state">No batches recorded</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="section-title">Vitamin A Fortification Records</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Batch ID</th><th>Date</th><th>Oil Vol (L)</th><th>Target (IU/g)</th><th>Vit A Added (g)</th><th>Operator</th><th>Approver</th><th>NAFDAC Status</th></tr></thead>
            <tbody>
              {vitAll.map(b=>(
                <tr key={b.id}>
                  <td className="td-mono">{b.id}</td>
                  <td className="td-muted">{b.date}</td>
                  <td className="td-mono">{fmtN(b.oil_volume)}</td>
                  <td className="td-mono" style={{color:(b.target_conc||0)>=11?'var(--green)':'var(--red)'}}>{b.target_conc||'—'}</td>
                  <td className="td-mono">{b.vitA_g||'—'}</td>
                  <td>{b.operator}</td>
                  <td className="td-muted">{b.approver||'Pending'}</td>
                  <td>
                    {b.status==='approved' && (b.target_conc||0)>=11
                      ? <span className="badge badge-approved">✓ COMPLIANT</span>
                      : b.status==='pending'
                      ? <span className="badge badge-pending">PENDING</span>
                      : <span className="badge badge-rejected">NON-COMPLIANT</span>
                    }
                  </td>
                </tr>
              ))}
              {vitAll.length===0&&<tr><td colSpan={8} className="empty-state">No Vitamin A batches recorded</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card" style={{fontSize:12,color:'var(--text3)'}}>
        <div className="section-title">Declaration</div>
        This report is generated by the {COMPANY} Operations Platform. NAFDAC registration numbers are product-specific — each oil line and pack size (e.g. 40 cl Soybean vs 1.5 L Soybean vs 40 cl Groundnut) carries its own number. Vitamin A fortification is conducted in compliance with NAFDAC regulations for edible vegetable oil fortification in Nigeria (minimum 11 IU/g Retinol equivalent). This document is valid for official submission to the National Agency for Food and Drug Administration and Control (NAFDAC).
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   AUDIT LOG
══════════════════════════════════════════════════════════ */
function AuditLogPage({ auditLog }) {
  const [filter, setFilter] = useState('all');
  const categories = ['all','batch','approval','inventory','auth','system'];
  const filtered = filter==='all' ? auditLog : auditLog.filter(a=>a.category===filter);

  return (
    <div>
      <div className="page-heading mb-4">Audit Trail</div>
      <div className="page-sub mb-16">{auditLog.length} events logged · last 200 retained</div>

      <div className="tabs">
        {categories.map(c=>(
          <div key={c} className={`tab-item${filter===c?' active':''}`} onClick={()=>setFilter(c)}>
            {c.charAt(0).toUpperCase()+c.slice(1)} {c!=='all'?`(${auditLog.filter(a=>a.category===c).length})`:`(${auditLog.length})`}
          </div>
        ))}
      </div>

      <div className="card">
        {filtered.length===0 && <div className="empty-state">No audit events in this category</div>}
        {filtered.map(a=>(
          <div key={a.id} className="audit-row">
            <div className="audit-dot" style={{
              background: a.level==='success'?'var(--green)':a.level==='warning'?'var(--accent)':a.level==='error'?'var(--red)':'var(--blue)'
            }}/>
            <div className="audit-time">{a.time}</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="audit-action">{a.action}</div>
              <div className="audit-user">By {a.user} · <span className="tag">{a.category}</span></div>
            </div>
            <span className={`badge ${a.level==='success'?'badge-approved':a.level==='warning'?'badge-pending':a.level==='error'?'badge-rejected':'badge-info'}`} style={{flexShrink:0}}>
              {a.level.toUpperCase()}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   ROLE & USER MANAGEMENT
══════════════════════════════════════════════════════════ */
function RoleManagement({ user, users, setUsers, addAudit, showToast, permissions, setPermissions }) {
  const [activeTab, setActiveTab] = useState('users');
  const canEditPerms = user.role==='superadmin' || user.role==='admin';
  const togglePermission = (role, perm) => {
    setPermissions(prev => {
      const next = { ...prev, [role]: { ...prev[role], [perm]: !prev[role]?.[perm] } };
      return next;
    });
    addAudit(`Permission "${perm}" ${permissions[role]?.[perm]?'revoked from':'granted to'} role "${role}"`,'warning','system');
  };
  const resetPermissions = () => {
    setPermissions(DEFAULT_PERMISSIONS);
    addAudit('Permission matrix reset to defaults','warning','system');
    showToast('Permissions reset to defaults');
  };
  const [editUser, setEditUser]   = useState(null);
  const [showAdd, setShowAdd]     = useState(false);
  const [newUser, setNewUser]     = useState({ name:'', email:'', password:'', role:'user', position:'Lab Technician', custom_role:'lab_tech_role', active:true });

  const isSuperAdmin = user.role === 'superadmin';

  const saveEdit = () => {
    if (!editUser) return;
    setUsers(prev => prev.map(u => u.id===editUser.id ? editUser : u));
    addAudit(`User "${editUser.name}" updated — role: ${editUser.role}, position: ${editUser.position}`,'info','system');
    showToast('User updated');
    setEditUser(null);
  };

  const toggleActive = (u) => {
    if (u.id === user.id) return showToast("Can't deactivate yourself",'error');
    setUsers(prev => prev.map(x => x.id===u.id ? {...x,active:!x.active} : x));
    addAudit(`User "${u.name}" ${u.active?'deactivated':'activated'}`,'warning','system');
    showToast(`User ${u.active?'deactivated':'activated'}`);
  };

  const addUser = () => {
    if (!newUser.name||!newUser.email||!newUser.password) return showToast('All fields required','error');
    if (users.find(u=>u.email.toLowerCase()===newUser.email.toLowerCase())) return showToast('Email already in use','error');
    const u = { ...newUser, id:'u'+Date.now(), created:todayStr() };
    setUsers(p=>[...p,u]);
    addAudit(`New user created: ${u.name} (${u.email}) — role: ${u.role}, position: ${u.position}`,'success','system');
    showToast(`${u.name} added`);
    setNewUser({name:'',email:'',password:'',role:'user',position:'Lab Technician',custom_role:'lab_tech_role',active:true});
    setShowAdd(false);
  };

  const deleteUser = (u) => {
    if (u.id===user.id) return showToast("Can't delete yourself",'error');
    if (!isSuperAdmin) return showToast('Only Super Admin can delete users','error');
    setUsers(prev=>prev.filter(x=>x.id!==u.id));
    addAudit(`User "${u.name}" deleted by ${user.name}`,'warning','system');
    showToast(`${u.name} deleted`);
  };

  const permNames = {
    naoh_calculator:'NaOH Calc', phosphoric_calculator:'Phosphoric Calc', vitamina_calculator:'Vitamin A Calc',
    cost_dashboard:'Cost Dashboard', price_calculator:'Price Setting', analytics_dashboard:'Analytics', nafdac_report:'NAFDAC Report',
    inventory_management:'Inventory', audit_log:'Audit Log', can_delete_batches:'Delete Batches',
    role_management:'Role Mgmt', inflation_settings:'Inflation Settings',
  };

  return (
    <div>
      <div className="flex-between mb-16">
        <div>
          <div className="page-heading">Role & User Management</div>
          <div className="page-sub">{users.length} users · {users.filter(u=>u.active).length} active · {users.filter(u=>!u.active).length} inactive</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {isSuperAdmin && <span className="badge badge-rejected" style={{padding:'4px 10px'}}>Super Admin Mode</span>}
          <button className="btn btn-primary" onClick={()=>setShowAdd(!showAdd)}>+ Add User</button>
        </div>
      </div>

      {isSuperAdmin && (
        <div className="alert alert-danger mb-16">
          <span className="alert-icon">⬡</span>
          Super Admin mode active. You have unrestricted access to all user management functions including deletion and role override.
        </div>
      )}

      <div className="tabs">
        <div className={`tab-item${activeTab==='users'?' active':''}`} onClick={()=>setActiveTab('users')}>Users ({users.length})</div>
        <div className={`tab-item${activeTab==='roles'?' active':''}`} onClick={()=>setActiveTab('roles')}>Role Permissions</div>
      </div>

      {/* ADD USER FORM */}
      {showAdd && (
        <div className="card accent-border mb-16">
          <div className="section-title">Add New User</div>
          <div className="form-grid cols-3">
            <div className="field"><label>Full Name</label><input value={newUser.name} onChange={e=>setNewUser({...newUser,name:e.target.value})} placeholder="e.g. John Doe"/></div>
            <div className="field"><label>Email Address</label><input type="email" value={newUser.email} onChange={e=>setNewUser({...newUser,email:e.target.value})} placeholder="john@ugomba.com"/></div>
            <div className="field"><label>Password</label><input type="password" value={newUser.password} onChange={e=>setNewUser({...newUser,password:e.target.value})} placeholder="Set initial password"/></div>
            <div className="field">
              <label>System Role</label>
              <select value={newUser.role} onChange={e=>setNewUser({...newUser,role:e.target.value})}>
                {isSuperAdmin && <option value="superadmin">Super Admin</option>}
                <option value="admin">Admin</option>
                <option value="user">User</option>
              </select>
            </div>
            <div className="field">
              <label>Position</label>
              <select value={newUser.position} onChange={e=>setNewUser({...newUser,position:e.target.value})}>
                {Object.keys(POSITION_LEVELS).filter(p=>p!=='SuperAdmin').map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Custom Role (Permissions)</label>
              <select value={newUser.custom_role} onChange={e=>setNewUser({...newUser,custom_role:e.target.value})}>
                <option value="full_access">Full Access</option>
                <option value="manager_role">Manager Role</option>
                <option value="lab_tech_role">Lab Tech Role</option>
                <option value="secretary_role">Secretary Role</option>
              </select>
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:8}}>
            <button className="btn btn-success" onClick={addUser}>Create User</button>
            <button className="btn btn-ghost" onClick={()=>setShowAdd(false)}>Cancel</button>
          </div>
        </div>
      )}

      {/* EDIT USER MODAL */}
      {editUser && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setEditUser(null)}>
          <div className="modal">
            <div className="modal-title">Edit User: {editUser.name}</div>
            <div className="modal-sub">Modify role, position, and permissions. Password changes are saved immediately.</div>
            <div className="form-grid cols-2">
              <div className="field"><label>Full Name</label><input value={editUser.name} onChange={e=>setEditUser({...editUser,name:e.target.value})}/></div>
              <div className="field"><label>Email</label><input value={editUser.email} onChange={e=>setEditUser({...editUser,email:e.target.value})}/></div>
              <div className="field"><label>New Password (leave blank = no change)</label><input type="password" placeholder="New password…" onChange={e=>e.target.value&&setEditUser({...editUser,password:e.target.value})}/></div>
              <div className="field">
                <label>System Role</label>
                <select value={editUser.role} onChange={e=>setEditUser({...editUser,role:e.target.value})}>
                  {isSuperAdmin&&<option value="superadmin">Super Admin</option>}
                  <option value="admin">Admin</option>
                  <option value="user">User</option>
                </select>
              </div>
              <div className="field">
                <label>Position</label>
                <select value={editUser.position} onChange={e=>setEditUser({...editUser,position:e.target.value})}>
                  {Object.keys(POSITION_LEVELS).filter(p=>isSuperAdmin||p!=='SuperAdmin').map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Custom Role</label>
                <select value={editUser.custom_role} onChange={e=>setEditUser({...editUser,custom_role:e.target.value})}>
                  <option value="full_access">Full Access</option>
                  <option value="manager_role">Manager Role</option>
                  <option value="lab_tech_role">Lab Tech Role</option>
                  <option value="secretary_role">Secretary Role</option>
                </select>
              </div>
            </div>
            <div className="modal-actions">
              <button className="btn btn-ghost" onClick={()=>setEditUser(null)}>Cancel</button>
              <button className="btn btn-success" onClick={saveEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* USERS TABLE */}
      {activeTab === 'users' && (
        <div className="card">
          <div className="table-wrap">
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>System Role</th><th>Position</th><th>Custom Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody>
                {users.map(u=>(
                  <tr key={u.id}>
                    <td className="td-primary">{u.name}{u.id===user.id&&<span style={{fontSize:10,color:'var(--text3)',marginLeft:6}}>(you)</span>}</td>
                    <td className="td-mono" style={{fontSize:12}}>{u.email}</td>
                    <td><span className={`role-pill rp-${u.role}`}>{u.role.toUpperCase()}</span></td>
                    <td>{u.position}</td>
                    <td><span className="tag">{u.custom_role}</span></td>
                    <td><span className={`badge ${u.active?'badge-active':'badge-inactive'}`}>{u.active?'ACTIVE':'INACTIVE'}</span></td>
                    <td className="td-muted">{u.created||'—'}</td>
                    <td>
                      <div style={{display:'flex',gap:4}}>
                        <button className="btn btn-ghost btn-xs" onClick={()=>setEditUser({...u})}>Edit</button>
                        {u.id!==user.id&&<button className="btn btn-xs" style={{background:u.active?'rgba(231,76,60,.15)':'rgba(46,204,113,.15)',color:u.active?'var(--red)':'var(--green)',border:'none',borderRadius:4,cursor:'pointer'}} onClick={()=>toggleActive(u)}>{u.active?'Deactivate':'Activate'}</button>}
                        {isSuperAdmin&&u.id!==user.id&&<button className="btn btn-danger btn-xs" onClick={()=>deleteUser(u)}>Del</button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* PERMISSIONS MATRIX */}
      {activeTab === 'roles' && (
        <div className="card">
          <div className="flex-between mb-8">
            <div className="section-title" style={{margin:0}}>Permission Matrix — Custom Roles {canEditPerms && <span style={{fontSize:11,color:'var(--text3)',fontWeight:400}}>· click a cell to toggle</span>}</div>
            {canEditPerms && <button className="btn btn-ghost btn-sm" onClick={resetPermissions}>↺ Reset to defaults</button>}
          </div>
          <div className="table-wrap">
            <table className="matrix-table">
              <thead>
                <tr>
                  <th>Permission</th>
                  {Object.keys(permissions).map(r=><th key={r} style={{textAlign:'center'}}>{r.replace('_role','').replace('_',' ')}</th>)}
                </tr>
              </thead>
              <tbody>
                {Object.entries(permNames).map(([perm,label])=>(
                  <tr key={perm}>
                    <td className="td-primary">{label}</td>
                    {Object.keys(permissions).map(role=>{
                      const on = !!permissions[role]?.[perm];
                      return (
                        <td key={role} style={{textAlign:'center'}}>
                          {canEditPerms ? (
                            <button
                              onClick={()=>togglePermission(role, perm)}
                              title={`${on?'Revoke':'Grant'} ${label} for ${role.replace('_role','')}`}
                              style={{cursor:'pointer',background:on?'rgba(46,204,113,.15)':'rgba(231,76,60,.12)',color:on?'var(--green)':'var(--red)',border:'1px solid '+(on?'rgba(46,204,113,.35)':'rgba(231,76,60,.3)'),borderRadius:6,width:30,height:26,fontSize:15,lineHeight:1}}>
                              {on?'✓':'✗'}
                            </button>
                          ) : (
                            <span style={{color:on?'var(--green)':'var(--red)',fontSize:16}}>{on?'✓':'✗'}</span>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="alert alert-info mt-12">
            <span className="alert-icon">ℹ</span>
            <div>{canEditPerms ? 'Click any cell to grant/revoke a permission for that custom role — changes apply immediately and persist. ' : ''}SuperAdmin and Admin roles bypass all permission checks and always have full access regardless of custom_role assignment. The matrix applies to users with role=<span className="tag">user</span>.</div>
          </div>
        </div>
      )}
    </div>
  );
}

   MOUNT

</script>
